
[build]
  publish = "."
  # Regenerates one HTML page per product plus the sitemap, so the markup a
  # crawler sees is the right product rather than the template's defaults.
  # The script exits cleanly if Supabase is unreachable, leaving the committed
  # pages in place — a build problem must never take the shop down.
  command = "python3 tools/build_pages.py"

# Security headers. The site had none: no clickjacking protection, no
# content-type protection, and nothing limiting where scripts may be loaded
# from. 'unsafe-inline' is unavoidable for now because the pages carry inline
# scripts and styles, but naming the allowed hosts still blocks an injected
# <script src="https://somewhere-else"> from running.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # worker-src is NOT optional, and 'self' blob: alone is NOT enough.
    #
    # The original fault, 3 October: with no worker-src at all the browser falls
    # back to script-src, which does not allow blob:, so pdf.js quietly dropped
    # to its main-thread "fake worker". Measured on live: an RSVP card designed
    # in the studio sat on "Checking your foil layer..." for over 40 seconds and
    # never finished, so it could not be added to the basket at all.
    #
    # The directive added then said 'self' blob:, on the belief that pdf.js
    # starts its worker from a blob: URL. It does not. pdf.js v3 points
    # GlobalWorkerOptions.workerSrc at the cdnjs file and calls new Worker() on
    # that URL directly, so 'self' blob: blocked it just as surely. Proven on
    # live, 7 October, by constructing the worker in the page:
    #
    #   Failed to construct 'Worker': Script at
    #   'https://cdnjs.cloudflare.com/.../pdf.worker.min.js'
    #   cannot be accessed from origin 'https://foreverprint.com'
    #
    # So every PDF the site opened was still being parsed and rendered on the UI
    # thread, four days after the fix that was supposed to stop that. Measured:
    # a 998KB vector PDF took 364ms with the page frozen for 47% of it, and an
    # image-heavy file is far worse.
    #
    # cdnjs is added rather than worked around. It grants no new trust: pdf.js
    # itself already loads from cdnjs under script-src, so the worker comes from
    # an origin the page is already executing code from.
    #
    # The tell is "Warning: Setting up fake worker" in the console. It is not
    # enough to check the directive EXISTS — it existed all along. Check that a
    # Worker can actually be constructed from the URL pdf.js is using.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://cdnjs.cloudflare.com https://js.stripe.com https://www.googletagmanager.com https://googleads.g.doubleclick.net https://www.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://jvcpzmumkyjdyibmwlsd.supabase.co https://*.supabase.co https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.google.co.uk https://googleads.g.doubleclick.net https://ad.doubleclick.net https://www.googleadservices.com; connect-src 'self' https://apis.google.com https://jvcpzmumkyjdyibmwlsd.supabase.co https://*.supabase.co https://api.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.google.com https://ad.doubleclick.net https://googleads.g.doubleclick.net https://www.googleadservices.com https://www.google.co.uk https://www.google.ie https://www.google.de https://www.google.fr https://www.google.es https://www.google.it https://www.google.nl; frame-src https://apis.google.com https://www.google.com https://js.stripe.com https://hooks.stripe.com https://td.doubleclick.net https://www.googletagmanager.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com"

# The admin holds orders and financials — keep it out of search results.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ─── CACHING ────────────────────────────────────────────────
# Netlify serves everything with max-age=0 by default, so a returning visitor
# re-checks every image and script. Images and the version-stamped vendor
# bundle never change under the same name, so they can be cached hard. Our own
# JavaScript deliberately is not: it changes on deploy and is not fingerprinted,
# and stale code would be far more expensive than the bytes saved.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The daily review sweep is DELIBERATELY NOT SCHEDULED.
#
# Trustpilot now sends the invitations itself: send-dispatch.js BCCs their
# Automatic Feedback Service address, and they invite the customer after the
# delay set in the Trustpilot dashboard. Those reviews come back marked
# verified, which counts for more than one left by someone following a link.
#
# Running our own sweep as well would ask every customer twice. The function
# and its email are kept because they still work — if Trustpilot is ever
# dropped, set REVIEW_URL and restore the schedule line below.
#
# [functions."send-review-requests-due"]
#   schedule = "0 9 * * *"

# ─── SUPPLIER PRICE WATCH ───────────────────────────────────
# PrintedEasy change their prices without notice — their own terms say so —
# and we buy at a fixed 20% off their list. So a rise at their end lands
# silently in our cost while we carry on selling at last week's price.
#
# This samples about twenty prices every Monday morning and emails if any have
# moved, or if a stock or weight has come or gone from their range. It changes
# nothing: a human runs tools/printedeasy_refresh.py and then publishes.
#
# Needs SUPABASE_SERVICE_KEY, RESEND_API_KEY and FROM_EMAIL, which are already
# set. ALERT_EMAIL is optional and falls back to FROM_EMAIL.
[functions."printedeasy-price-watch"]
  schedule = "0 8 * * 1"

# ─── ARTWORK RETENTION ──────────────────────────────────────
# The artwork bucket had no DELETE policy, so nothing could ever clear it.
# Measured 7 October: 140 files, 206MB, of which 130 files and 198MB were
# unclaimed and over a day old. It only grows, and every file is a customer's
# design sitting on the storage bill and in our data-protection obligations
# for no reason.
#
# Deletes ONLY files no order refers to, and only when they are more than five
# days old. Artwork attached to an order is never touched at any age: the
# printer is sent links to these files and fetches them when they produce the
# job, so a deleted file is an order that cannot be printed.
#
# It runs as a DRY RUN until ARTWORK_RETENTION_LIVE=true is set in Netlify.
# Until then this schedule just writes a nightly report to the function log,
# which is the point — read a few before arming it.
[functions."artwork-retention"]
  schedule = "0 3 * * *"

# ─── SAVED DESIGN REMINDER ──────────────────────────────────
# docs/CRM.md W4. Somebody saved a design and has not ordered.
#
# It CANNOT send yet: the email body is deliberately unwritten, because copy
# on this site is Nicholas's and an unattended email to a real customer is the
# last place to break that. Until the words exist AND SAVED_REMINDER_LIVE=true
# is set, this writes a nightly report of who it WOULD email and sends nothing
# — which is the useful half anyway, because it shows the list before a word
# is committed to.
#
# One email per saved design, ever, guarded by saved_designs.reminder_sent_at.
[functions."saved-design-reminder"]
  schedule = "0 9 * * *"
