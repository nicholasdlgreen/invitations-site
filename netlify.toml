
[build]
  publish = "."
  # Regenerates one HTML page per product plus the sitemap, so the markup a
  # crawler sees is the right product rather than the template's defaults.
  # The script exits cleanly if Supabase is unreachable, leaving the committed
  # pages in place — a build problem must never take the shop down.
  command = "python3 tools/build_pages.py"

# Security headers. The site had none: no clickjacking protection, no
# content-type protection, and nothing limiting where scripts may be loaded
# from. 'unsafe-inline' is unavoidable for now because the pages carry inline
# scripts and styles, but naming the allowed hosts still blocks an injected
# <script src="https://somewhere-else"> from running.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://cdnjs.cloudflare.com https://js.stripe.com https://www.googletagmanager.com https://googleads.g.doubleclick.net https://www.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://jvcpzmumkyjdyibmwlsd.supabase.co https://*.supabase.co https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.google.co.uk https://googleads.g.doubleclick.net https://ad.doubleclick.net https://www.googleadservices.com; connect-src 'self' https://apis.google.com https://jvcpzmumkyjdyibmwlsd.supabase.co https://*.supabase.co https://api.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.google.com https://ad.doubleclick.net https://googleads.g.doubleclick.net https://www.googleadservices.com https://www.google.co.uk https://www.google.ie https://www.google.de https://www.google.fr https://www.google.es https://www.google.it https://www.google.nl; frame-src https://apis.google.com https://www.google.com https://js.stripe.com https://hooks.stripe.com https://td.doubleclick.net https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com"

# The admin holds orders and financials — keep it out of search results.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ─── CACHING ────────────────────────────────────────────────
# Netlify serves everything with max-age=0 by default, so a returning visitor
# re-checks every image and script. Images and the version-stamped vendor
# bundle never change under the same name, so they can be cached hard. Our own
# JavaScript deliberately is not: it changes on deploy and is not fingerprinted,
# and stale code would be far more expensive than the bytes saved.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
