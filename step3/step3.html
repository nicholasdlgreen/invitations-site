<!-- STEP 3 markup. Ids are the only binding points; all data is supplied by
     the host page through Step3.mount(). -->
<div id="s3wrap">
<div class="rail" id="rail"></div>
<div class="wrap">

  <section class="stage open" id="s1">
    <div class="num"><b>1</b><h2>Choose your range</h2></div>
    <div class="ind"><div class="feels" id="feels"></div></div>
  </section>

  <!-- Choosing the stock and its weight is ONE decision, so it is one step.
       Splitting them would number the same choice twice. -->
  <section class="stage locked" id="stocks">
    <div class="num"><b>2</b><h2>Your paper</h2></div>
    <div class="ind">
      <div class="swatches" id="swatches"></div>
      <div class="stock">
        <div class="pic" id="pic"><span class="bigart" id="bigart"></span></div>
        <div class="info">
          <div class="nm" id="pName"></div>
          <div class="ds" id="pDesc"></div>
          <div class="lab">Thickness</div>
          <div id="weights"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="stage locked" id="s2">
    <div class="num"><b>2</b><h2>Finishing</h2></div>
    <p class="say" id="finSay"></p>
    <div class="ind" id="finBody"></div>
  </section>

  <!-- Envelopes sit here, before the quantity step, because how many
       envelopes you need is decided by how many cards you order — not the
       other way round. -->
  <section class="stage locked" id="s5">
    <div class="num"><b>4</b><h2>Envelopes</h2></div>
    <div class="ind"><div class="envs" id="envs"></div></div>
  </section>

  <section class="stage locked" id="s3">
    <div class="num"><b>3</b><h2>How many</h2></div>
    <p class="say" id="qtySay"></p>
    <div class="ind"><div class="qtys" id="qtys"></div></div>
  </section>

  <section class="stage locked" id="s4">
    <div class="num"><b>4</b><h2>When you need them</h2></div>
    <div class="ind"><div class="dels" id="dels"></div></div>
  </section>

</div>

<div class="bar" id="bar"><div class="barIn">
  <div class="sum" id="sum"></div>
  <div class="tot" id="tot"></div>
  <button class="go-btn" id="add">Add to basket</button>
</div></div>
</div>
