<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Step 3 preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@200;300;400;500&display=swap">
<link rel="stylesheet" href="/step3/step3.css">
<style>
  :root{--cream:#FAF7F2;--white:#fff;--line:#EFE7E0;--text:#3D2E24;--soft:#7A6558;--pale:#B0A098;--gold:#B8976A;color-scheme:light}
  html,body{margin:0;background:var(--cream);color:var(--text);font-family:'Jost',system-ui,sans-serif}
  .hdr{max-width:1060px;margin:0 auto;padding:18px 32px 0;font-size:12.5px;color:var(--soft);line-height:1.6}
  .hdr b{color:var(--text);font-weight:500}
  .hdr code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px}
</style>
</head>
<body>
<div class="hdr">
  <p><b>Step 3, exactly as the shop draws it.</b> This page loads the same
     <code>step3.css</code>, <code>step3.html</code> and <code>step3.js</code> that
     upload-and-print.html loads. Change one and both change — which is what stops
     the approved design and the shipped one drifting apart.</p>
  <p id="state"></p>
</div>
<div id="mount"></div>

<script src="/step3/step3.js"></script>
<script>
// A preview adapter. The shop's adapter lives in upload-and-print.html and
// feeds the same renderer from the live page state; this one reads Supabase
// directly so the step can be looked at without going through an upload.
const SB='https://jvcpzmumkyjdyibmwlsd.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2Y3B6bXVta3lqZHlpYm13bHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMTY2MzYsImV4cCI6MjA4OTg5MjYzNn0.JBOAoMdotrbxmL3M4nFhdJ6yQWX45YbgtDCgMtJktSE';
const SLUG=new URLSearchParams(location.search).get('product')||'wedding-invitations';
const FED=['Tintoretto Gesso','Nettuno Bianco','Acquerello Bianco','Sirio Pearl Polar Dawn'];
const RECY=['Recycled Uncoated'];
const IMG={'Uncoated':'uncoated','Silk':'silk','Ice White':'icewhite','Recycled Uncoated':'recycled',
  'Tintoretto Gesso':'tintoretto','Nettuno Bianco':'nettuno','Acquerello Bianco':'acquerello',
  'Sirio Pearl Polar Dawn':'polardawn'};

let PAPERS=[],SHEETS=[],FINS=[],CAPS={},TYPES=[],SIZE='A5',LADDER=[],ALLOWF=[];
const get=async p=>{const r=await fetch(SB+'/rest/v1/'+p,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});return r.ok?r.json():[];};
const priceOf=(n,g,q)=>{const w=parseInt(g,10);const r=SHEETS.find(x=>x.paper===n&&x.size===SIZE&&parseInt(x.qty,10)===q&&(x.gsm==null||!w||parseInt(x.gsm,10)===w));return r?parseFloat(r.sell):null;};
const finCost=t=>{const f=FINS.find(x=>x.name===t);return f?parseFloat(f.sell):0;};

(async function(){
  document.getElementById('mount').innerHTML = await (await fetch('/step3/step3.html')).text();
  const [ps,pt,pc]=await Promise.all([
    get('paper_stocks?select=name,subtitle,description,weights&active=eq.true&order=display_order'),
    get('product_types?select=*&slug=eq.'+SLUG),
    get('pricing_config?select=payload&order=published_at.desc&limit=1')
  ]);
  TYPES=await get('finish_types?select=name,description,options&order=display_order');
  const payload=(pc[0]&&pc[0].payload)||{};
  const prod=((payload.products)||[]).find(x=>x.slug===SLUG)||{};
  SHEETS=prod.sheet_sells||[]; FINS=prod.finish_sells||[];
  ((payload.papers)||[]).forEach(p=>{CAPS[p.name]=p.finishes||[];});
  const row=pt[0]||{};
  SIZE=(row.available_sizes||['A5'])[0];
  LADDER=(row.quantity_ladder&&row.quantity_ladder.length)?row.quantity_ladder:[25,50,100,150,200,250,300,500];
  ALLOWF=(row.available_finishes||[]).map(x=>x.toLowerCase().trim());
  PAPERS=ps;
  const allow=(row.available_papers||[]).map(x=>x.toLowerCase().trim());
  if(allow.length) PAPERS=PAPERS.filter(p=>allow.includes(p.name.toLowerCase().trim()));
  PAPERS=PAPERS.filter(p=>(p.weights||[]).some(w=>LADDER.some(q=>priceOf(p.name,w.gsm,q)!=null)));

  const S=Step3.state;
  const weightsFor=p=>(p.weights||[]).filter(w=>LADDER.some(q=>priceOf(p.name,w.gsm,q)!=null));
  const finishesFor=n=>{
    const caps=(CAPS[n]||[]).map(x=>x.toLowerCase());
    return TYPES.filter(t=>caps.includes(t.name.toLowerCase()))
      .filter(t=>!ALLOWF.length||ALLOWF.includes(t.name.toLowerCase()))
      .filter(t=>(t.options||[]).some(o=>o.name&&o.name.toLowerCase()!=='none'));
  };
  const goods=()=>{
    let t=priceOf(S.paper,S.weight,S.qty)||0;
    Object.keys(S.finishes).forEach(k=>{const v=S.finishes[k];if(v&&v.toLowerCase()!=='none')t+=finCost(k);});
    return t;
  };
  const DELS=[{id:'standard',name:'Standard',blurb:'Printed in 3 working days, then tracked delivery',pct:0,min:0,cap:null,days:4},
              {id:'express',name:'Express',blurb:'Printed in 2 working days, order by 4pm',pct:20,min:20,cap:3000,days:3},
              {id:'express-plus',name:'Express Plus',blurb:'Printed next working day, order by 1pm',pct:40,min:40,cap:1500,days:2}];
  const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const arrival=n=>{const d=new Date();let k=n;while(k>0){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)k--;}return D[d.getDay()]+' '+d.getDate()+' '+M[d.getMonth()];};

  Step3.init({
    papers:()=>PAPERS,
    feelOf:n=>FED.includes(n)?'textured':(RECY.includes(n)?'kinder':'signature'),
    imageFor:n=>IMG[n]?'/img/paper/'+IMG[n]+'.jpg':null,
    weightsFor,
    finishTypesFor:finishesFor,
    quantities:()=>LADDER.filter(q=>priceOf(S.paper,S.weight,q)!=null),
    perCardAt:n=>{const b=priceOf(S.paper,S.weight,n);if(b==null)return null;
      let t=b;Object.keys(S.finishes).forEach(k=>{const v=S.finishes[k];if(v&&v.toLowerCase()!=='none')t+=finCost(k);});return t/n;},
    deliveries:()=>{const g=goods();return DELS.map(o=>{
      const tooBig=o.cap&&g>o.cap;const c=o.pct?Math.max(g*o.pct/100,o.min):0;
      return {id:o.id,name:o.name,blurb:o.blurb,arrival:arrival(o.days),
              cost:tooBig?'—':(c>0?'+£'+c.toFixed(2):'Free'),disabled:!!tooBig};});},
    money:()=>{const g=goods();const o=DELS.find(x=>x.id===S.del);
      const d=o&&o.pct?Math.max(g*o.pct/100,o.min):0;return {total:S.qty?g+d:null};},
    onSelect:()=>{},
    onAdd:()=>alert('On the shop this adds to the basket.')
  });
  document.getElementById('state').textContent =
    (row.name||SLUG)+' · '+PAPERS.length+' papers · '+SIZE+' · ladder ['+LADDER.join(', ')+']';
})();
</script>
</body>
</html>
