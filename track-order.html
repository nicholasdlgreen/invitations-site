<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Track Your Order | Foreverprint</title>
<meta name="description" content="Track the status of your personalised wedding invitation order. Enter your order number and email to see live updates from print to delivery."/>
<meta name="robots" content="index, follow"/>
<link rel="canonical" href="https://foreverprint.com/track-order.html"/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://foreverprint.com/track-order.html"/>
<meta property="og:title" content="Track Your Order | Foreverprint"/>
<meta property="og:description" content="Track your wedding invitation order from print to delivery."/>
<meta property="og:image" content="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=1200&q=80"/>
<meta property="og:locale" content="en_GB"/>
<meta property="og:site_name" content="Foreverprint"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="Track Your Order | Foreverprint"/>
<meta name="twitter:description" content="Track your wedding invitation order from print to delivery."/>
<meta name="twitter:image" content="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=1200&q=80"/>
<style>
.form-input{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--white);font-family:'Jost',sans-serif;font-size:13px;font-weight:300;color:var(--text);outline:none;transition:border-color .2s;border-radius:8px;}
.form-input:focus{border-color:var(--gold-lt);}
.form-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:8px;font-weight:400;}
</style>
</head>
<body>

<div id="site-header"></div>

<!-- TRACK ORDER PAGE -->
<div style="min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:60px 32px;background:var(--cream);">
  <div style="max-width:480px;width:100%;text-align:center;">
    <span class="tag">Track Your Order</span>
    <h1 class="serif" style="font-size:2.5rem;font-weight:400;margin-bottom:16px;">Where is my order?</h1>
    <div class="divider" style="margin:20px auto;"></div>
    <p style="font-size:13px;color:var(--soft);line-height:1.9;margin-bottom:36px;">Enter your order number and email address to see the current status of your invitations.</p>
    <div style="background:var(--white);border:1px solid var(--border);border-radius:20px;padding:36px;">
      <div style="margin-bottom:16px;text-align:left;">
        <label class="form-label">Order Number</label>
        <input class="form-input" id="trackOrderInput" placeholder="e.g. FP-2026-5678"/>
      </div>
      <div style="margin-bottom:24px;text-align:left;">
        <label class="form-label">Email Address</label>
        <input class="form-input" id="trackEmailInput" placeholder="your@email.com" onkeydown="if(event.key==='Enter') trackOrder()"/>
      </div>
      <button class="btn" style="width:100%;justify-content:center;" onclick="trackOrder()">Track My Order</button>
    </div>
    <div id="trackResult" style="margin-top:24px;"></div>
    <p style="font-size:12px;color:var(--pale);margin-top:24px;line-height:1.8;">Can't find your order? Email us at <a href="mailto:hello@foreverprint.com" style="color:var(--gold);text-decoration:underline;">hello@foreverprint.com</a> and we'll help you straight away.</p>
  </div>
</div>

<div id="site-footer"></div>

<script>
fetch('/header.html').then(r=>r.text()).then(html=>{
  document.getElementById('site-header').outerHTML=html;
  if(typeof updateCartBadge==='function') updateCartBadge();
});
fetch('/footer.html').then(r=>r.text()).then(html=>{
  document.getElementById('site-footer').outerHTML=html;
});

// ── ORDER TRACKING ────────────────────────────────────────
async function trackOrder() {
  const orderNum = document.getElementById('trackOrderInput').value.trim().toUpperCase();
  const email = document.getElementById('trackEmailInput').value.trim().toLowerCase();
  const result = document.getElementById('trackResult');

  if (!orderNum || !email) {
    result.innerHTML = `<div style="background:#FCEAEA;border:1px solid #f5c5c5;border-radius:16px;padding:20px;text-align:center;font-size:13px;color:var(--err);">Please enter both your order number and email address.</div>`;
    return;
  }

  result.innerHTML = `<div style="text-align:center;padding:20px;font-size:13px;color:var(--soft);">Looking up your order…</div>`;

  const order = await lookupLiveOrder(orderNum, email);
  if (order) {
    renderTrackResult(result, order);
  } else {
    result.innerHTML = `<div style="background:#FCEAEA;border:1px solid #f5c5c5;border-radius:16px;padding:24px;text-align:center;"><div style="font-size:13px;color:var(--err);line-height:1.7;">No order found with those details. Please check your order number and email address — or contact us at <a href="mailto:hello@foreverprint.com" style="color:var(--err);text-decoration:underline;">hello@foreverprint.com</a> and we'll find it for you.</div></div>`;
  }
}

async function lookupLiveOrder(orderNum, email) {
  try {
    const SUPABASE_URL = 'https://jvcpzmumkyjdyibmwlsd.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2Y3B6bXVta3lqZHlpYm13bHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMTY2MzYsImV4cCI6MjA4OTg5MjYzNn0.JBOAoMdotrbxmL3M4nFhdJ6yQWX45YbgtDCgMtJktSE';
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/orders?order_number=eq.${encodeURIComponent(orderNum)}&select=*`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }
    );
    if (!res.ok) return null;
    const rows = await res.json();
    if (!rows.length) return null;
    const row = rows[0];
    if ((row.customer_email || '').toLowerCase() !== email) return null;

    const statusStages = ['new','proof','printing','dispatched','delivered'];
    const curIdx = statusStages.indexOf(row.status);

    return {
      name: row.customer_name || 'Customer',
      suite: row.design_name || row.paper_stock || 'Custom Design',
      qty: row.quantity || '—',
      total: row.total_inc_vat ? '£' + parseFloat(row.total_inc_vat).toFixed(2) : '—',
      date: row.created_at ? new Date(row.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—',
      status: row.status,
      dpd: row.tracking_number || null,
      stages: [
        { name:'Order Received', desc:'Your order was received and payment confirmed.', date: row.created_at ? new Date(row.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—', done: curIdx >= 0 },
        { name:'Design Approved', desc:'Your digital proof was approved.', date:'—', done: curIdx >= 2 },
        { name:'Printing', desc:'Your invitations are being printed.', date:'—', done: curIdx >= 3 },
        { name:'Dispatched', desc: row.tracking_number ? 'Dispatched via courier. Tracking: ' + row.tracking_number : 'Dispatched via courier.', date:'—', done: curIdx >= 3, active: curIdx === 3 },
        { name:'Delivered', desc:'Your invitations have been delivered.', date:'—', done: curIdx >= 4 },
      ]
    };
  } catch(e) {
    return null;
  }
}

function renderTrackResult(result, order) {
  const statusLabels = { new:'Order Received', proof:'Awaiting Proof Approval', printing:'In Production', dispatched:'Dispatched', delivered:'Delivered', cancelled:'Cancelled' };
  const statusColour = { dispatched:['#EAF0F7','#4A7FAA'], proof:['#FDF4E7','#C97B3A'], delivered:['#EAF4EE','#5A9E6F'], new:['#EAF4EE','#5A9E6F'], printing:['#EAF4EE','#5A9E6F'], cancelled:['#FCEAEA','#C94A3A'] };
  const sc = statusColour[order.status] || ['#EAF4EE','#5A9E6F'];
  result.innerHTML = `
    <div style="background:var(--white);border:1px solid var(--border);border-radius:20px;padding:32px;text-align:left;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
        <div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:400;margin-bottom:4px;">${order.name}</div>
          <div style="font-size:12px;color:var(--soft);">${order.suite} · ${order.qty} invitations · ${order.total}</div>
          <div style="font-size:11px;color:var(--pale);margin-top:4px;">Ordered ${order.date}</div>
        </div>
        <div style="background:${sc[0]};color:${sc[1]};padding:6px 14px;border-radius:20px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;">${statusLabels[order.status]||order.status}</div>
      </div>
      ${order.dpd ? `<div style="background:var(--cream);border-radius:12px;padding:14px 18px;margin-bottom:24px;font-size:12px;color:var(--soft);">Tracking: <span style="color:var(--text);font-weight:500;">${order.dpd}</span></div>` : ''}
      <div style="position:relative;">
        ${order.stages.map((s,i) => `
          <div style="display:flex;gap:16px;${i<order.stages.length-1?'margin-bottom:0;padding-bottom:24px;':''}">
            <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;">
              <div style="width:28px;height:28px;border-radius:50%;border:2px solid ${s.done?'var(--gold)':s.active?'var(--gold)':'var(--border)'};background:${s.done?'var(--gold)':'var(--white)'};display:flex;align-items:center;justify-content:center;font-size:11px;color:${s.done?'#fff':s.active?'var(--gold)':'var(--pale)'};">${s.done?'&#x2713;':s.active?'&#x25CF;':'&#x25CB;'}</div>
              ${i<order.stages.length-1?`<div style="width:2px;flex:1;min-height:24px;background:${s.done?'var(--gold-lt)':'var(--border)'};margin-top:4px;margin-bottom:-4px;"></div>`:''}
            </div>
            <div style="padding-bottom:${i<order.stages.length-1?'24':'0'}px;">
              <div style="font-size:13px;font-weight:${s.done||s.active?500:400};color:${s.done||s.active?'var(--text)':'var(--pale)'};">${s.name}</div>
              <div style="font-size:12px;color:var(--soft);margin-top:2px;">${s.desc}</div>
              ${s.date && s.date!=='—' ? `<div style="font-size:11px;color:var(--pale);margin-top:2px;">${s.date}</div>` : ''}
            </div>
          </div>`).join('')}
      </div>
    </div>`;
}

// Pre-fill from URL params e.g. track-order.html?ref=FP-2026-5678&email=...
document.addEventListener('DOMContentLoaded', function() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('ref')) document.getElementById('trackOrderInput').value = params.get('ref');
  if (params.get('email')) document.getElementById('trackEmailInput').value = params.get('email');
  if (params.get('ref') && params.get('email')) trackOrder();
});
</script>

</body>
</html>
