<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset your password — forever·print</title>
<meta name="description" content="Forgot your password? We'll send you a link to reset it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="/prefetch.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/auth.js"></script>
<style>
  :root{
    --cream:#FAF7F2;--white:#FFFFFF;--gold:#B8976A;--gold-lt:#D4B896;
    --brown:#6B4F3A;--text:#3D2E24;--soft:#7A6A5C;--pale:#A89788;
    --border:#E5DDD0;--err:#B85C5C;--ok:#5C8A6A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--cream);color:var(--text);font-family:'Jost',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;display:flex;flex-direction:column;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
  .auth-card{width:100%;max-width:440px;background:var(--white);border:1px solid var(--border);border-radius:20px;padding:48px 40px;box-shadow:0 12px 36px rgba(61,46,36,.06);}
  @media(max-width:560px){.auth-card{padding:36px 24px;}}
  .auth-eyebrow{font-size:var(--text-xs);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:14px;}
  .auth-title{font-family:'Cormorant Garamond',serif;font-size:2.1rem;font-weight:400;color:var(--text);text-align:center;margin-bottom:8px;line-height:1.15;}
  .auth-sub{font-size:var(--text-sm);color:var(--soft);text-align:center;margin-bottom:32px;line-height:1.6;}
  .form-group{margin-bottom:18px;}
  .form-label{display:block;font-size:var(--text-xs);font-weight:500;color:var(--text);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
  .form-input{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:10px;background:var(--cream);font-family:inherit;font-size:var(--text-body);color:var(--text);font-weight:400;transition:border-color .2s,background .2s;}
  .form-input:focus{outline:none;border-color:var(--gold);background:var(--white);}
  .btn-submit{width:100%;background:var(--gold);color:var(--white);border:none;padding:15px 24px;border-radius:10px;font-family:inherit;font-size:var(--text-body);font-weight:500;letter-spacing:.04em;cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;}
  .btn-submit:hover:not(:disabled){background:var(--brown);}
  .btn-submit:disabled{background:var(--pale);cursor:not-allowed;}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .auth-foot{text-align:center;font-size:var(--text-sm);color:var(--soft);margin-top:24px;}
  .auth-foot a{color:var(--gold);text-decoration:none;font-weight:500;}
  .auth-foot a:hover{color:var(--brown);}
  .form-msg{padding:12px 16px;border-radius:10px;font-size:var(--text-sm);margin-bottom:18px;display:none;line-height:1.5;}
  .form-msg.err{background:#FCEAEA;color:var(--err);display:block;}
  .form-msg.ok{background:#EAF4ED;color:var(--ok);display:block;}
  #sentView{display:none;text-align:center;}
  .check-circle{width:64px;height:64px;border-radius:50%;background:var(--cream);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--gold);font-size:var(--text-h2);}
</style>
</head>
<body>

<header id="site-header"></header>

<main>
  <div class="auth-card">
    <div id="formView">
      <div class="auth-eyebrow">forever·print</div>
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-sub">Enter your email and we'll send you a link to set a new password.</p>

      <div id="formMsg" class="form-msg"></div>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="spinner" id="spinner"></span>
          <span id="submitText">Send reset link</span>
        </button>
      </form>

      <div class="auth-foot">
        <a href="/login.html">← Back to sign in</a>
      </div>
    </div>

    <div id="sentView">
      <div class="check-circle">✓</div>
      <h1 class="auth-title">Check your inbox</h1>
      <p class="auth-sub" id="sentMsg">If an account exists for that email, we've sent a password reset link. Click it to choose a new password.</p>
      <div class="auth-foot"><a href="/login.html">← Back to sign in</a></div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script>
  fetch('/header.html').then(r=>r.text()).then(h=>{document.getElementById('site-header').innerHTML=h;}).catch(()=>{});
  fetch('/footer.html').then(r=>r.text()).then(h=>{document.getElementById('site-footer').innerHTML=h;}).catch(()=>{});
</script>

<script>
const form = document.getElementById('forgotForm');
const submitBtn = document.getElementById('submitBtn');
const submitText = document.getElementById('submitText');
const spinner = document.getElementById('spinner');
const formMsg = document.getElementById('formMsg');

function showMsg(text, type){
  formMsg.textContent = text;
  formMsg.className = 'form-msg ' + type;
}
function setLoading(loading){
  submitBtn.disabled = loading;
  spinner.style.display = loading ? 'inline-block' : 'none';
  submitText.textContent = loading ? 'Sending…' : 'Send reset link';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  if (!email || !email.includes('@')){
    showMsg('Please enter a valid email address.', 'err');
    return;
  }

  if (!window.invAuth || !window.invAuth.requestPasswordReset){
    showMsg('Service unavailable. Please try again in a moment.', 'err');
    return;
  }

  setLoading(true);

  // Note: Supabase intentionally returns success even for unknown emails
  // (prevents email enumeration attacks). So we always show the "sent" state.
  await window.invAuth.requestPasswordReset(
    email,
    window.location.origin + '/reset-password.html'
  );

  // Show success state regardless of result (security best practice)
  document.getElementById('formView').style.display = 'none';
  document.getElementById('sentView').style.display = 'block';
  document.getElementById('sentMsg').innerHTML =
    `If an account exists for <strong>${email}</strong>, we've sent a password reset link. Click it to choose a new password.`;
});
</script>

</body>
</html>
