<style>
/* ── ENTRY SCREEN STYLES ── */
.entry-main{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:60px 32px}
.entry-wrap{max-width:1080px;width:100%;margin:0 auto;text-align:center}

.entry-intro{margin-bottom:60px}
.entry-intro .tag{font-size:var(--text-xs);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:18px;display:block}
.entry-intro h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.4rem,4.5vw,3.4rem);font-weight:300;line-height:1.1;color:var(--text);margin-bottom:18px}
.entry-intro h1 em{font-style:italic;color:var(--gold)}
.entry-divider{width:48px;height:1px;background:var(--gold-lt);margin:24px auto}
.entry-intro p{font-size:var(--text-body);color:var(--soft);max-width:520px;margin:0 auto;line-height:1.95}

.doors{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.door{background:var(--white);border:1px solid var(--border);border-radius:24px;padding:0;text-decoration:none;color:inherit;cursor:pointer;transition:all .35s;position:relative;overflow:hidden;display:flex;flex-direction:column;text-align:left}
.door:hover{box-shadow:0 24px 60px rgba(61,46,36,.10);transform:translateY(-4px);border-color:var(--gold-lt)}

.door-visual{aspect-ratio:16/10;background:var(--ivory,#F4EFE8);overflow:hidden;border-bottom:1px solid var(--border);position:relative}

/* Path A visual: template thumbnails */
.tpl-mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px;height:100%;align-content:center;background:linear-gradient(135deg,#F4EFE8 0%,#FAF7F2 100%)}
.tpl-mini{background:var(--white);border-radius:6px;aspect-ratio:148/210;overflow:hidden;box-shadow:0 4px 12px rgba(61,46,36,.08);transition:transform .25s}
.door:hover .tpl-mini{transform:scale(1.02)}
.tpl-mini svg{width:100%;height:100%;display:block}

/* Path B visual: stylized brief box */
.brief-illustration{height:100%;background:linear-gradient(135deg,#3D2E24 0%,#5A4233 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;position:relative;overflow:hidden}
.brief-illustration::before{content:'';position:absolute;top:-50%;right:-20%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(184,151,106,.15) 0%,transparent 70%)}
.brief-illustration::after{content:'';position:absolute;bottom:-30%;left:-15%;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(212,184,150,.12) 0%,transparent 70%)}
.brief-prompt-box{background:rgba(255,255,255,.06);border:1px solid rgba(212,184,150,.3);border-radius:12px;padding:16px 20px;width:80%;max-width:340px;backdrop-filter:blur(10px);position:relative;z-index:1}
.brief-prompt-line{height:5px;background:rgba(212,184,150,.4);border-radius:3px;margin-bottom:7px}
.brief-prompt-line:nth-child(1){width:90%}
.brief-prompt-line:nth-child(2){width:70%}
.brief-prompt-line:nth-child(3){width:84%;background:rgba(212,184,150,.25)}
.brief-spark{position:absolute;color:rgba(212,184,150,.4);font-family:serif;z-index:1}
.brief-spark.s1{top:18%;left:14%;font-size:var(--text-body)}
.brief-spark.s2{top:70%;right:16%;font-size:var(--text-lg)}
.brief-spark.s3{top:30%;right:20%;font-size:var(--text-xs)}
.brief-spark.s4{bottom:22%;left:22%;font-size:var(--text-sm)}

.coming-soon-badge{position:absolute;top:14px;right:14px;background:var(--gold);color:#fff;padding:5px 12px;border-radius:60px;font-size:var(--text-xs);letter-spacing:.16em;text-transform:uppercase;font-weight:500;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.25)}

.door-body{padding:32px 32px 36px;flex:1;display:flex;flex-direction:column}
.door-tag{font-size:var(--text-xs);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:12px}
.door-title{font-family:'Cormorant Garamond',serif;font-size:1.85rem;font-weight:400;color:var(--text);line-height:1.2;margin-bottom:14px}
.door-title em{font-style:italic;color:var(--gold)}
.door-desc{font-size:var(--text-sm);color:var(--soft);line-height:1.95;margin-bottom:24px;flex:1}
.door-points{margin-bottom:28px;display:flex;flex-direction:column;gap:8px}
.door-point{font-size:var(--text-sm);color:var(--soft);display:flex;align-items:center;gap:10px}
.door-point::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--gold-lt);flex-shrink:0}
.door-cta{display:inline-flex;align-items:center;gap:10px;font-size:var(--text-xs);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:500;align-self:flex-start;transition:gap .25s}
.door:hover .door-cta{gap:18px}
.door-cta::after{content:'→';font-size:var(--text-body)}

.door.coming-soon{cursor:default}
.door.coming-soon:hover{transform:none;box-shadow:none;border-color:var(--border)}
.door.coming-soon .door-cta{color:var(--pale)}
.door.coming-soon:hover .door-cta{gap:10px}

/* Coming soon modal */
.cs-modal-bg{position:fixed;inset:0;background:rgba(61,46,36,.55);z-index:600;display:none;align-items:center;justify-content:center;padding:24px}
.cs-modal-bg.open{display:flex}
.cs-modal{background:var(--white);max-width:480px;width:100%;border-radius:20px;padding:40px 36px;text-align:center;animation:csFade .25s ease both}
@keyframes csFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.cs-modal h3{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:400;color:var(--text);margin-bottom:14px}
.cs-modal h3 em{font-style:italic;color:var(--gold)}
.cs-modal p{font-size:var(--text-sm);color:var(--soft);line-height:1.85;margin-bottom:24px}
.cs-modal .cs-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cs-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--gold);color:#fff;border:none;font-family:'Jost',sans-serif;font-size:var(--text-xs);letter-spacing:.16em;text-transform:uppercase;font-weight:500;border-radius:60px;cursor:pointer;text-decoration:none;transition:background .25s}
.cs-btn:hover{background:var(--brown)}
.cs-btn-out{background:transparent;color:var(--soft);border:1px solid var(--border)}
.cs-btn-out:hover{background:transparent;color:var(--gold);border-color:var(--gold)}

@media (max-width: 760px){
  .doors{grid-template-columns:1fr;gap:20px}
  .entry-main{padding:40px 24px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
  
<style>
.studio-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;margin-top:10px;}
.sp-card{display:block;border:1px solid var(--border,#e8e0d5);border-radius:18px;overflow:hidden;background:var(--white,#fff);text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s,border-color .2s;}
.sp-card:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(61,46,36,.10);border-color:var(--gold,#b8976a);}
.sp-img{aspect-ratio:4/3;background:var(--cream,#f6f1e9);overflow:hidden;}
.sp-img img{width:100%;height:100%;object-fit:cover;display:block;}
.sp-body{padding:15px 18px 18px;}
.sp-name{font-family:'Cormorant Garamond',serif;font-size:1.22rem;font-weight:400;color:var(--text,#3d2e24);margin-bottom:4px;line-height:1.25;}
.sp-tag{font-size:.82rem;color:var(--soft,#7a6558);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.sp-loading{grid-column:1/-1;text-align:center;padding:44px 0;color:var(--soft,#7a6558);font-size:.92rem;}
.studio-alt{text-align:center;margin-top:34px;font-size:.92rem;color:var(--soft,#7a6558);}
.studio-alt a{color:var(--gold,#b8976a);}
</style>
</head>
<body>

<div id="site-header"></div>

<main class="entry-main">
  <div class="entry-wrap">

    <div class="entry-intro">
      <span class="tag">The Design Studio</span>
      <h1>What would you like to <em>create?</em></h1>
      <div class="entry-divider"></div>
      <p>Choose what you're making and our studio will design it with you — describe the look you want, see it come to life, then adjust until it's right.</p>
    </div>

    <div class="studio-picker" id="studio-products">
      <div class="sp-loading">Loading the studio…</div>
    </div>

    <p class="studio-alt">Already have your own artwork? <a href="/upload-and-print.html">Upload &amp; print it instead</a></p>

  </div>
</main>

<div id="site-footer"></div>

<script>
// ── STUDIO PRODUCT CHOOSER ───────────────────────────────
// Lists the products the AI studio is actually configured for (studio_config),
// so a product only appears here once its wording fields and style options are
// set up in admin.
(function loadStudioProducts(){
  var SB = 'https://jvcpzmumkyjdyibmwlsd.supabase.co';
  var K  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2Y3B6bXVta3lqZHlpYm13bHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMTY2MzYsImV4cCI6MjA4OTg5MjYzNn0.JBOAoMdotrbxmL3M4nFhdJ6yQWX45YbgtDCgMtJktSE';
  var el = document.getElementById('studio-products');
  if (!el) return;
  var headers = { apikey: K, Authorization: 'Bearer ' + K };
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Someone may arrive with a product already chosen (an old link, a shared
  // URL, a bookmark). Send them where they were going instead of making them
  // pick again — but only if that product is actually set up in the studio.
  var wanted = new URLSearchParams(location.search).get('product');

  Promise.all([
    fetch(SB + '/rest/v1/studio_config?select=product_slug', { headers }).then(function(r){ return r.ok ? r.json() : []; }),
    fetch(SB + '/rest/v1/product_types?select=slug,name,tagline,hero_image_url,display_order&active=eq.true&order=display_order', { headers }).then(function(r){ return r.ok ? r.json() : []; })
  ]).then(function(res){
    var ready = {};
    (res[0] || []).forEach(function(c){ ready[c.product_slug] = true; });
    if (wanted && ready[wanted]) {
      location.replace('/design-studio-ai-create.html?product=' + encodeURIComponent(wanted));
      return;
    }
    var list = (res[1] || []).filter(function(p){ return ready[p.slug]; });
    if (!list.length){
      el.innerHTML = '<div class="sp-loading">Our studio is being set up — <a href="/products.html">browse our products</a> in the meantime.</div>';
      return;
    }
    el.innerHTML = list.map(function(p){
      return '<a class="sp-card" href="/design-studio-ai-create.html?product=' + encodeURIComponent(p.slug) + '">' +
        '<div class="sp-img">' + (p.hero_image_url ? '<img src="' + esc(p.hero_image_url) + '" alt="" loading="lazy">' : '') + '</div>' +
        '<div class="sp-body"><div class="sp-name">' + esc(p.name) + '</div>' +
        (p.tagline ? '<div class="sp-tag">' + esc(p.tagline) + '</div>' : '') + '</div></a>';
    }).join('');
  }).catch(function(){
    el.innerHTML = '<div class="sp-loading">We could not load the studio just now. <a href="/products.html">Browse our products</a> instead.</div>';
  });
})();

fetch('/header.html').then(r=>r.text()).then(html=>{
  document.getElementById('site-header').outerHTML=html;
  if(typeof updateCartBadge==='function') updateCartBadge();
});
fetch('/footer.html').then(r=>r.text()).then(html=>{
  document.getElementById('site-footer').outerHTML=html;
});

function _removedComingSoon(e){
  e.preventDefault();
  document.getElementById('csModal').classList.add('open');
}
function closeComingSoon(e){
  if(e) e.preventDefault();
  document.getElementById('csModal').classList.remove('open');
}
</script>

  <script src="/help-widget.js" defer></script>
</body>
