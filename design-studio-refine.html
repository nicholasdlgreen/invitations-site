<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Refine Your Design | Design With Our Tools | Foreverprint</title>
<meta name="description" content="Refine your chosen wedding invitation design — adjust the colours and style, with our recommendations to guide you."/>
<meta name="robots" content="noindex, follow"/>
<link rel="canonical" href="https://foreverprint.com/design-studio-refine.html"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Refine Your Design | Foreverprint"/>
<meta property="og:image" content="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=1200&q=80"/>
<meta property="og:site_name" content="Foreverprint"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<style>
.breadcrumb{background:var(--cream);padding:14px 32px;font-size:11px;letter-spacing:.04em;color:var(--pale);max-width:1280px;margin:0 auto}
.breadcrumb a{color:var(--soft);text-decoration:none}
.breadcrumb a:hover{color:var(--gold)}
.breadcrumb span{margin:0 8px;color:var(--pale)}

.rf-hero{background:var(--cream);padding:40px 32px 30px;text-align:center;border-bottom:1px solid var(--border)}
.rf-hero-inner{max-width:600px;margin:0 auto}
.rf-hero .tag{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:12px;display:block}
.rf-hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.9rem,3.4vw,2.5rem);font-weight:300;line-height:1.18;color:var(--text);margin-bottom:14px}
.rf-hero h1 em{font-style:italic;color:var(--gold)}
.rf-divider{width:48px;height:1px;background:var(--gold-lt);margin:16px auto}
.rf-hero p{font-size:14px;color:var(--soft);line-height:1.9;max-width:460px;margin:0 auto}

.rf-main{max-width:440px;margin:0 auto;padding:40px 32px 60px}
.rf-preview-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:34px}
.rf-preview{width:212px;border:.5px solid var(--border);border-radius:7px;overflow:hidden;box-shadow:0 14px 40px rgba(61,46,36,.08)}
.rf-preview svg{display:block;width:100%}
.rf-preview-note{font-size:11.5px;color:var(--pale);letter-spacing:.03em;margin-top:12px;font-style:italic;font-family:'Cormorant Garamond',serif;font-size:1rem}

.rf-section{margin-bottom:30px}
.rf-section-label{font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:14px}

.rf-opts{display:flex;flex-wrap:wrap;gap:10px}
.rf-opt{font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.03em;padding:9px 14px;border:1px solid var(--border);border-radius:60px;background:var(--white);color:var(--soft);cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.rf-opt:hover:not(.on){border-color:var(--gold-lt);color:var(--gold)}
.rf-opt.on{background:var(--text);color:#fff;border-color:var(--text)}
.rf-dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:.5px solid rgba(0,0,0,.12)}
.rf-pick{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-left:4px}
.rf-opt.on .rf-pick{color:var(--gold-lt)}

.rf-actions{margin-top:32px;text-align:center}
.rf-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;background:var(--gold);color:#fff;border:none;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;border-radius:60px;cursor:pointer;transition:background .25s}
.rf-btn:hover{background:var(--brown)}
.rf-back{display:block;margin-top:18px;font-size:12px;color:var(--pale);letter-spacing:.03em;text-decoration:none}
.rf-back:hover{color:var(--gold)}

@media (max-width:760px){
  .rf-main{padding:32px 22px 48px}
  .breadcrumb{padding:14px 22px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
</head>
<body>

<div id="site-header"></div>

<div class="breadcrumb">
  <a href="/design-studio.html">Design Studio</a><span>&rsaquo;</span><a href="/design-studio-create.html">Design with our tools</a><span>&rsaquo;</span>Refine
</div>

<section class="rf-hero">
  <div class="rf-hero-inner">
    <span class="tag">Refine the design</span>
    <h1>Adjust the <em>look.</em></h1>
    <div class="rf-divider"></div>
    <p>Change the colours or the style until it feels right — we've marked what we'd suggest. Your names and date come next.</p>
  </div>
</section>

<main class="rf-main">

  <div class="rf-preview-wrap">
    <div class="rf-preview" id="previewWrap"></div>
    <div class="rf-preview-note">Your names, date and venue are added on the next step.</div>
  </div>

  <div class="rf-section">
    <div class="rf-section-label">Colours</div>
    <div class="rf-opts" id="palOpts"></div>
  </div>

  <div class="rf-section">
    <div class="rf-section-label">Style</div>
    <div class="rf-opts" id="styleOpts"></div>
  </div>

  <div class="rf-actions">
    <button class="rf-btn" id="rfContinue">Continue &mdash; add your details</button>
    <a class="rf-back" href="/design-studio-suggestions.html">&larr; Back to the three designs</a>
  </div>

</main>

<div id="site-footer"></div>

<script>
fetch('/header.html').then(r=>r.text()).then(html=>{
  document.getElementById('site-header').outerHTML=html;
  if(typeof updateCartBadge==='function') updateCartBadge();
});
fetch('/footer.html').then(r=>r.text()).then(html=>{
  document.getElementById('site-footer').outerHTML=html;
});

// ─── READ THE CHOSEN DESIGN ──────────────────────────────────
let choice = { recipe:'floral', palette:'blush' };
try {
  const saved = JSON.parse(sessionStorage.getItem('foreverprint_design_choice') || 'null');
  if (saved) choice = Object.assign(choice, saved);
} catch(e){}

const PALS = {
  sage:    {name:'Sage & ivory',    bg:'#F4EFE8', leaf:'#8FA98F', accent:'#C29A9A', text:'#2E3B2A', sub:'#6B6258'},
  blush:   {name:'Blush & sage',    bg:'#F6EFE9', leaf:'#8FA98F', accent:'#C29A9A', text:'#3D2E24', sub:'#6B6258'},
  copper:  {name:'Copper & cream',  bg:'#FAF7F2', leaf:'#C97B3A', accent:'#9A7A55', text:'#3D2E24', sub:'#6B6258'},
  navy:    {name:'Navy & gold',     bg:'#FAF7F2', leaf:'#2C3E50', accent:'#B8976A', text:'#2C3E50', sub:'#6B6258'},
  burgundy:{name:'Burgundy & rose', bg:'#FAF7F2', leaf:'#8B2942', accent:'#C29A9A', text:'#3D2E24', sub:'#6B6258'},
  charcoal:{name:'Charcoal & ivory',bg:'#F4EFE8', leaf:'#4A4A4A', accent:'#9A9A9A', text:'#2A2A2A', sub:'#6B6258'}
};
const STYLES = { floral:'Floral', sprig:'Sprig', minimal:'Minimal' };

const recRecipe  = ['sprig','floral','minimal'].includes(choice.recipe) ? choice.recipe : 'floral';
const recPalette = PALS[choice.palette] ? choice.palette : 'blush';

const state = { recipe: recRecipe, palette: recPalette };

const MOTIFS = {
  sprig: p => `
    <path d="M74 42 Q73 53 74 64" stroke="${p.leaf}" stroke-width=".7" fill="none"/>
    <ellipse cx="74" cy="42" rx="1.8" ry="3.2" fill="${p.leaf}"/>
    <ellipse cx="70" cy="48" rx="2" ry="4" fill="${p.leaf}" transform="rotate(-38 70 48)"/>
    <ellipse cx="78" cy="48" rx="2" ry="4" fill="${p.leaf}" transform="rotate(38 78 48)"/>
    <ellipse cx="68" cy="55" rx="2.1" ry="4.2" fill="${p.leaf}" transform="rotate(-32 68 55)"/>
    <ellipse cx="80" cy="55" rx="2.1" ry="4.2" fill="${p.leaf}" transform="rotate(32 80 55)"/>`,
  floral: p => `
    <g fill="${p.leaf}">
      <ellipse cx="58" cy="52" rx="1.7" ry="3.4" transform="rotate(-50 58 52)"/>
      <ellipse cx="64" cy="48" rx="1.7" ry="3.4" transform="rotate(-30 64 48)"/>
      <ellipse cx="74" cy="46" rx="1.7" ry="3.4"/>
      <ellipse cx="84" cy="48" rx="1.7" ry="3.4" transform="rotate(30 84 48)"/>
      <ellipse cx="90" cy="52" rx="1.7" ry="3.4" transform="rotate(50 90 52)"/>
    </g>
    <ellipse cx="62" cy="58" rx="1.6" ry="3" fill="${p.accent}" transform="rotate(-40 62 58)"/>
    <ellipse cx="74" cy="60" rx="1.7" ry="3.2" fill="${p.accent}"/>
    <ellipse cx="86" cy="58" rx="1.6" ry="3" fill="${p.accent}" transform="rotate(40 86 58)"/>`,
  minimal: p => `
    <line x1="50" y1="70" x2="98" y2="70" stroke="${p.accent}" stroke-width=".5"/>
    <line x1="50" y1="176" x2="98" y2="176" stroke="${p.accent}" stroke-width=".5"/>`
};

function render(){
  const p = PALS[state.palette];
  const r = state.recipe;
  const spaced = r==='minimal';
  const ls = spaced ? 'letter-spacing="1.4"' : '';
  const ns = spaced ? 11 : 12.5;
  const div = (r==='minimal') ? '' : `<line x1="60" y1="144" x2="88" y2="144" stroke="${p.leaf}" stroke-width=".5"/>`;
  document.getElementById('previewWrap').innerHTML = `<svg viewBox="0 0 148 210" xmlns="http://www.w3.org/2000/svg" style="background:${p.bg}">
    <rect width="148" height="210" fill="${p.bg}"/>
    ${MOTIFS[r](p)}
    <text x="74" y="84" text-anchor="middle" font-family="Georgia,serif" font-size="4.1" font-style="italic" fill="${p.sub}" letter-spacing="1">together with their families</text>
    <text x="74" y="103" text-anchor="middle" font-family="Georgia,serif" font-size="${ns}" fill="${p.text}" ${ls}>Charlotte</text>
    <text x="74" y="118" text-anchor="middle" font-family="Georgia,serif" font-size="6.3" font-style="italic" fill="${p.accent}">&amp;</text>
    <text x="74" y="134" text-anchor="middle" font-family="Georgia,serif" font-size="${ns}" fill="${p.text}" ${ls}>James</text>
    ${div}
    <text x="74" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="4.4" font-style="italic" fill="${p.sub}">Saturday &#183; 14 June 2026</text>
    <text x="74" y="164" text-anchor="middle" font-family="Georgia,serif" font-size="4.4" fill="${p.sub}">Blenheim Palace</text>
  </svg>`;
}

function buildPalOpts(){
  document.getElementById('palOpts').innerHTML = Object.keys(PALS).map(key => {
    const p = PALS[key];
    const isPick = key === recPalette;
    return `<button class="rf-opt${key===state.palette?' on':''}" data-pal="${key}">
      <span class="rf-dot" style="background:${p.bg};border-color:rgba(0,0,0,.18)"></span>
      <span class="rf-dot" style="background:${p.leaf}"></span>
      <span class="rf-dot" style="background:${p.accent}"></span>
      ${p.name}${isPick?'<span class="rf-pick">Our pick</span>':''}
    </button>`;
  }).join('');
  document.querySelectorAll('#palOpts .rf-opt').forEach(o => {
    o.addEventListener('click', () => {
      state.palette = o.getAttribute('data-pal');
      document.querySelectorAll('#palOpts .rf-opt').forEach(x => x.classList.toggle('on', x.getAttribute('data-pal')===state.palette));
      render();
    });
  });
}
function buildStyleOpts(){
  document.getElementById('styleOpts').innerHTML = Object.keys(STYLES).map(key => {
    const isPick = key === recRecipe;
    return `<button class="rf-opt${key===state.recipe?' on':''}" data-style="${key}">${STYLES[key]}${isPick?'<span class="rf-pick">Our pick</span>':''}</button>`;
  }).join('');
  document.querySelectorAll('#styleOpts .rf-opt').forEach(o => {
    o.addEventListener('click', () => {
      state.recipe = o.getAttribute('data-style');
      document.querySelectorAll('#styleOpts .rf-opt').forEach(x => x.classList.toggle('on', x.getAttribute('data-style')===state.recipe));
      render();
    });
  });
}

// ─── CONTINUE → ADD YOUR DETAILS ─────────────────────────────
document.getElementById('rfContinue').addEventListener('click', () => {
  // Save the refined design so the details page picks it up
  choice.recipe = state.recipe;
  choice.palette = state.palette;
  sessionStorage.setItem('foreverprint_design_choice', JSON.stringify(choice));
  window.location.href = '/design-studio-details.html';
});

// ─── INIT ────────────────────────────────────────────────────
render();
buildPalOpts();
buildStyleOpts();
</script>

</body>
</html>
