<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Your Designs | Design With Our Tools | Foreverprint</title>
<meta name="description" content="Three wedding invitation designs composed from your answers, with the one we'd recommend. Choose your favourite and make it yours."/>
<meta name="robots" content="noindex, follow"/>
<link rel="canonical" href="https://foreverprint.com/design-studio-suggestions.html"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Your Designs | Foreverprint"/>
<meta property="og:image" content="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=1200&q=80"/>
<meta property="og:site_name" content="Foreverprint"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<style>
.breadcrumb{background:var(--cream);padding:14px 32px;font-size:11px;letter-spacing:.04em;color:var(--pale);max-width:1280px;margin:0 auto}
.breadcrumb a{color:var(--soft);text-decoration:none}
.breadcrumb a:hover{color:var(--gold)}
.breadcrumb span{margin:0 8px;color:var(--pale)}

.sg-hero{background:var(--cream);padding:44px 32px 36px;text-align:center;border-bottom:1px solid var(--border)}
.sg-hero-inner{max-width:680px;margin:0 auto}
.sg-hero .tag{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:14px;display:block}
.sg-hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,3.6vw,2.7rem);font-weight:300;line-height:1.18;color:var(--text);margin-bottom:16px}
.sg-hero h1 em{font-style:italic;color:var(--gold)}
.sg-divider{width:48px;height:1px;background:var(--gold-lt);margin:20px auto}
.sg-hero p{font-size:14px;color:var(--soft);line-height:1.9;max-width:480px;margin:0 auto}

.sg-main{max-width:760px;margin:0 auto;padding:44px 32px 60px}

.lead-card{max-width:360px;margin:0 auto;background:var(--white);border:1.5px solid var(--gold-lt);border-radius:20px;padding:26px 26px 28px;text-align:center}
.lead-badge{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:#fff;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:6px 14px;border-radius:60px;margin-bottom:18px}
.lead-preview{width:204px;margin:0 auto 18px;border:.5px solid var(--border);border-radius:7px;overflow:hidden}
.lead-rationale{font-size:13px;color:var(--soft);line-height:1.85;margin-bottom:16px}
.lead-dots{display:flex;align-items:center;justify-content:center;gap:7px;font-size:10.5px;color:var(--pale);letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px}
.lead-dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:.5px solid rgba(0,0,0,.12)}
.lead-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:var(--gold);color:#fff;border:none;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;border-radius:60px;cursor:pointer;transition:background .25s}
.lead-btn:hover{background:var(--brown)}
.lead-reassure{font-size:11px;color:var(--pale);letter-spacing:.03em;margin-top:14px;line-height:1.7}

.alt-label-row{text-align:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--pale);margin:36px 0 16px}
.alt-row{display:flex;gap:18px;justify-content:center;max-width:480px;margin:0 auto;flex-wrap:wrap}
.alt-card{flex:1;min-width:150px;max-width:210px;background:var(--white);border:1px solid var(--border);border-radius:15px;padding:13px;cursor:pointer;transition:all .25s;text-align:center}
.alt-card:hover{border-color:var(--gold-lt);box-shadow:0 12px 32px rgba(61,46,36,.09);transform:translateY(-3px)}
.alt-preview{border:.5px solid var(--border);border-radius:5px;overflow:hidden;margin-bottom:11px}
.alt-card-label{font-size:12px;color:var(--soft);letter-spacing:.02em;line-height:1.5}

.sg-restart{text-align:center;margin-top:40px}
.sg-restart a{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--pale);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;transition:all .2s}
.sg-restart a:hover{color:var(--gold);border-color:var(--gold-lt)}

@media (max-width:760px){
  .sg-main{padding:32px 22px 48px}
  .breadcrumb{padding:14px 22px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
</head>
<body>

<div id="site-header"></div>

<div class="breadcrumb">
  <a href="/design-studio.html">Design Studio</a><span>&rsaquo;</span><a href="/design-studio-create.html">Design with our tools</a><span>&rsaquo;</span>Your designs
</div>

<section class="sg-hero">
  <div class="sg-hero-inner">
    <span class="tag">Your designs</span>
    <h1 id="sgHeading">I've worked up <em>three for you.</em></h1>
    <div class="sg-divider"></div>
    <p id="sgIntro">Here's the one I'd choose, with two others in the same spirit. Pick whichever feels closest — you'll be able to make it yours next.</p>
  </div>
</section>

<main class="sg-main">
  <div id="leadSlot"></div>
  <div class="alt-label-row">Or, in the same spirit</div>
  <div class="alt-row" id="altSlot"></div>
  <div class="sg-restart"><a href="/design-studio-create.html">&larr; Start the questions again</a></div>
</main>

<div id="site-footer"></div>

<script>
fetch('/header.html').then(r=>r.text()).then(html=>{
  document.getElementById('site-header').outerHTML=html;
  if(typeof updateCartBadge==='function') updateCartBadge();
});
fetch('/footer.html').then(r=>r.text()).then(html=>{
  document.getElementById('site-footer').outerHTML=html;
});

// ─── READ THE BRIEF (from the questions page) ────────────────
let brief = { season:'summer', feeling:'romantic', colour:'auto', notes:'' };
try {
  const saved = JSON.parse(sessionStorage.getItem('foreverprint_brief') || 'null');
  if (saved) brief = Object.assign(brief, saved);
} catch(e){}

// ─── PALETTES ────────────────────────────────────────────────
const PALS = {
  sage:    {name:'Sage & ivory',    bg:'#F4EFE8', leaf:'#8FA98F', accent:'#C29A9A', text:'#2E3B2A', sub:'#6B6258'},
  blush:   {name:'Blush & sage',    bg:'#F6EFE9', leaf:'#8FA98F', accent:'#C29A9A', text:'#3D2E24', sub:'#6B6258'},
  copper:  {name:'Copper & cream',  bg:'#FAF7F2', leaf:'#C97B3A', accent:'#9A7A55', text:'#3D2E24', sub:'#6B6258'},
  navy:    {name:'Navy & gold',     bg:'#FAF7F2', leaf:'#2C3E50', accent:'#B8976A', text:'#2C3E50', sub:'#6B6258'},
  burgundy:{name:'Burgundy & rose', bg:'#FAF7F2', leaf:'#8B2942', accent:'#C29A9A', text:'#3D2E24', sub:'#6B6258'},
  charcoal:{name:'Charcoal & ivory',bg:'#F4EFE8', leaf:'#4A4A4A', accent:'#9A9A9A', text:'#2A2A2A', sub:'#6B6258'}
};

function pickPalette(b){
  if(b.colour==='soft')  return b.season==='spring' ? 'sage' : 'blush';
  if(b.colour==='warm')  return 'copper';
  if(b.colour==='deep')  return b.feeling==='romantic' ? 'burgundy' : 'navy';
  if(b.colour==='light') return 'charcoal';
  if(b.season==='autumn') return 'copper';
  if(b.season==='winter') return b.feeling==='modern' ? 'charcoal' : 'navy';
  if(b.feeling==='romantic') return 'blush';
  if(b.feeling==='botanical') return 'sage';
  if(b.feeling==='modern') return 'charcoal';
  return 'sage';
}

// ─── INVITATION RENDERERS (composed from palette + treatment) ─
function inviteText(p, opts){
  opts = opts || {};
  const ls = opts.spaced ? 'letter-spacing="1.6"' : '';
  const ns = opts.spaced ? 11 : 13;
  const div = opts.divider===false ? '' : `<line x1="60" y1="144" x2="88" y2="144" stroke="${p.leaf}" stroke-width=".5"/>`;
  return `
    <text x="74" y="84" text-anchor="middle" font-family="Georgia,serif" font-size="4.2" font-style="italic" fill="${p.sub}" letter-spacing="1">together with their families</text>
    <text x="74" y="103" text-anchor="middle" font-family="Georgia,serif" font-size="${ns}" fill="${p.text}" ${ls}>Charlotte</text>
    <text x="74" y="118" text-anchor="middle" font-family="Georgia,serif" font-size="6.5" font-style="italic" fill="${p.accent}">&amp;</text>
    <text x="74" y="134" text-anchor="middle" font-family="Georgia,serif" font-size="${ns}" fill="${p.text}" ${ls}>James</text>
    ${div}
    <text x="74" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="4.5" font-style="italic" fill="${p.sub}">Saturday &#183; 14 June 2026</text>
    <text x="74" y="164" text-anchor="middle" font-family="Georgia,serif" font-size="4.5" fill="${p.sub}">Blenheim Palace</text>`;
}

const MOTIFS = {
  sprig: p => `
    <path d="M74 42 Q73 53 74 64" stroke="${p.leaf}" stroke-width=".7" fill="none"/>
    <ellipse cx="74" cy="42" rx="1.8" ry="3.2" fill="${p.leaf}"/>
    <ellipse cx="70" cy="48" rx="2" ry="4" fill="${p.leaf}" transform="rotate(-38 70 48)"/>
    <ellipse cx="78" cy="48" rx="2" ry="4" fill="${p.leaf}" transform="rotate(38 78 48)"/>
    <ellipse cx="68" cy="55" rx="2.1" ry="4.2" fill="${p.leaf}" transform="rotate(-32 68 55)"/>
    <ellipse cx="80" cy="55" rx="2.1" ry="4.2" fill="${p.leaf}" transform="rotate(32 80 55)"/>`,
  floral: p => `
    <g fill="${p.leaf}">
      <ellipse cx="58" cy="52" rx="1.7" ry="3.4" transform="rotate(-50 58 52)"/>
      <ellipse cx="64" cy="48" rx="1.7" ry="3.4" transform="rotate(-30 64 48)"/>
      <ellipse cx="74" cy="46" rx="1.7" ry="3.4"/>
      <ellipse cx="84" cy="48" rx="1.7" ry="3.4" transform="rotate(30 84 48)"/>
      <ellipse cx="90" cy="52" rx="1.7" ry="3.4" transform="rotate(50 90 52)"/>
    </g>
    <ellipse cx="62" cy="58" rx="1.6" ry="3" fill="${p.accent}" transform="rotate(-40 62 58)"/>
    <ellipse cx="74" cy="60" rx="1.7" ry="3.2" fill="${p.accent}"/>
    <ellipse cx="86" cy="58" rx="1.6" ry="3" fill="${p.accent}" transform="rotate(40 86 58)"/>`,
  minimal: p => `
    <line x1="50" y1="70" x2="98" y2="70" stroke="${p.accent}" stroke-width=".5"/>
    <line x1="50" y1="176" x2="98" y2="176" stroke="${p.accent}" stroke-width=".5"/>`
};

function renderInvite(recipe, p){
  const opts = recipe==='minimal' ? {spaced:true, divider:false} : {};
  return `<svg viewBox="0 0 148 210" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;background:${p.bg}">${MOTIFS[recipe](p)}${inviteText(p,opts)}</svg>`;
}

// ─── COPY ────────────────────────────────────────────────────
const FEEL = {classic:'classic and timeless', romantic:'soft and romantic', botanical:'natural and botanical', modern:'modern and understated'};
const SEASON = {spring:'spring', summer:'summer', autumn:'autumn', winter:'winter'};
const RECIPE_DESC = {sprig:'A single, simple sprig', floral:'A fuller, more floral take', minimal:'Pared back and minimal'};

function leadRecipe(feeling){
  if(feeling==='modern') return 'minimal';
  if(feeling==='classic') return 'sprig';
  return 'floral';
}

// ─── SELECTION → REFINE ──────────────────────────────────────
function choose(recipe, paletteKey){
  sessionStorage.setItem('foreverprint_design_choice', JSON.stringify({
    template:'botanic', recipe:recipe, palette:paletteKey, brief:brief
  }));
  window.location.href = '/design-studio-customise.html?template=botanic';
}

// ─── BUILD THE PAGE ──────────────────────────────────────────
(function build(){
  const palKey = pickPalette(brief);
  const p = PALS[palKey];
  const lead = leadRecipe(brief.feeling);
  const order = ['floral','sprig','minimal'];
  const alts = order.filter(r => r !== lead);

  document.getElementById('sgHeading').innerHTML = `I've worked up <em>three for you.</em>`;
  document.getElementById('sgIntro').textContent =
    `All ${FEEL[brief.feeling]} for your ${SEASON[brief.season]} wedding — here's the one I'd choose, with two others in the same spirit.`;

  let rationale = `Because you're marrying in ${SEASON[brief.season]} and wanted something ${FEEL[brief.feeling]}, I've kept it light and unfussy — a ${p.name.toLowerCase()} palette with a delicate botanical touch and a classic serif that feels timeless rather than trendy.`;
  if (brief.notes) rationale += ` And there's room to weave in your note about &ldquo;${brief.notes.replace(/[<>]/g,'')}&rdquo; as you refine.`;

  document.getElementById('leadSlot').innerHTML = `
    <div class="lead-card">
      <span class="lead-badge">&#10022; The one I'd choose</span>
      <div class="lead-preview">${renderInvite(lead, p)}</div>
      <p class="lead-rationale">${rationale}</p>
      <div class="lead-dots">
        <span class="lead-dot" style="background:${p.bg};border-color:rgba(0,0,0,.18)"></span>
        <span class="lead-dot" style="background:${p.leaf}"></span>
        <span class="lead-dot" style="background:${p.accent}"></span>
        &nbsp;${p.name}
      </div>
      <button class="lead-btn" onclick="choose('${lead}','${palKey}')">Make this mine</button>
      <div class="lead-reassure">You'll be able to change colours, wording and details next.</div>
    </div>`;

  document.getElementById('altSlot').innerHTML = alts.map(r => `
    <div class="alt-card" onclick="choose('${r}','${palKey}')">
      <div class="alt-preview">${renderInvite(r, p)}</div>
      <div class="alt-card-label">${RECIPE_DESC[r]}</div>
    </div>`).join('');
})();
</script>

</body>
</html>
