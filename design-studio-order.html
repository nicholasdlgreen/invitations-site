<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Choose your order | Foreverprint</title>
<meta name="description" content="Choose your paper, quantity, envelopes and delivery, then add to basket."/>
<meta name="robots" content="noindex, follow"/>
<link rel="canonical" href="https://foreverprint.com/design-studio-order.html"/>
<style>
.breadcrumb{background:var(--cream);padding:14px 32px;font-size:var(--text-xs);letter-spacing:.04em;color:var(--pale);max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.breadcrumb-trail a{color:var(--soft);text-decoration:none}
.breadcrumb-trail a:hover{color:var(--gold)}
.breadcrumb-trail span{margin:0 8px;color:var(--pale)}

.order-wrap{max-width:1280px;margin:0 auto;padding:8px 32px 80px;display:grid;grid-template-columns:1fr 1fr;gap:64px}

.summary-col{position:sticky;top:88px;align-self:start;padding-top:8px}

.summary-thumb{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:24px;display:flex;gap:18px;align-items:center;margin-bottom:14px}
.thumb-img{width:80px;flex-shrink:0;aspect-ratio:148/210;border-radius:3px;overflow:hidden;box-shadow:0 4px 14px rgba(61,46,36,.12);background:var(--cream)}
.thumb-img svg{width:100%;height:100%;display:block}
.thumb-info{flex:1;min-width:0}
.thumb-tag{font-size:var(--text-xs);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.thumb-name{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:400;color:var(--text);line-height:1.2;margin-bottom:4px}
.thumb-meta{font-size:var(--text-xs);color:var(--soft);margin-bottom:8px}
.thumb-edit{font-size:var(--text-xs);letter-spacing:.06em;color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--gold-lt);padding-bottom:1px}
.thumb-edit:hover{color:var(--brown);border-bottom-color:var(--brown)}

.summary-box{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:26px 28px}
.summary-box h3{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:400;color:var(--text);margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.summary-line{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--text-sm);color:var(--soft);padding:7px 0;gap:14px}
.summary-line .item{flex:1;min-width:0}
.summary-line .item-sub{font-size:var(--text-xs);color:var(--pale);margin-top:1px}
.summary-line .price{white-space:nowrap;font-variant-numeric:tabular-nums}
.summary-line.subtle{color:var(--pale);font-size:var(--text-xs);padding:5px 0}
.summary-line.total{font-family:'Cormorant Garamond',serif;font-size:1.35rem;color:var(--text);font-weight:400;padding-top:14px;margin-top:8px;border-top:1px solid var(--border)}
.summary-line.total .price{color:var(--gold)}

.add-btn{width:100%;margin-top:18px;padding:16px 24px;background:var(--gold);color:#fff;border:none;font-family:'Jost',sans-serif;font-size:var(--text-xs);letter-spacing:.18em;text-transform:uppercase;font-weight:500;border-radius:60px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 18px rgba(184,151,106,.3);transition:all .25s}
.add-btn:hover{background:var(--brown);box-shadow:0 6px 24px rgba(107,79,58,.35)}
.add-btn::after{content:'→';font-size:var(--text-body)}
.add-btn.added{background:#5A9E6F}
.add-btn.added::after{content:'✓'}

.controls-col{padding-top:8px}
.section{margin-bottom:32px;padding-bottom:32px;border-bottom:1px solid var(--border)}
.section:last-of-type{border-bottom:none;margin-bottom:0;padding-bottom:0}
.section-h{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:400;color:var(--text);margin-bottom:6px}
.section-help{font-size:var(--text-sm);color:var(--soft);line-height:1.85;margin-bottom:18px}

.paper-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.paper-card{border:1.5px solid var(--border);border-radius:14px;padding:20px 16px;cursor:pointer;text-align:center;transition:all .2s;background:var(--white)}
.paper-card:hover:not(.on){border-color:var(--gold-lt)}
.paper-card.on{border-color:var(--gold);background:rgba(184,151,106,.04)}
.paper-name{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--text);margin-bottom:4px}
.paper-sub{font-size:var(--text-xs);color:var(--soft);line-height:1.5;margin-bottom:8px;min-height:30px}
.paper-price{font-size:var(--text-xs);color:var(--gold);font-weight:500}

.qty-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.qty-tab{padding:9px 16px;font-size:var(--text-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--pale);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.qty-tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.qty-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qty-pill{padding:11px 4px;border:1.5px solid var(--border);border-radius:8px;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1rem;color:var(--text);cursor:pointer;background:var(--white);text-align:center;transition:all .2s}
.qty-pill:hover:not(.on){border-color:var(--gold-lt)}
.qty-pill.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.qty-custom-input{width:100%;max-width:200px;padding:14px;border:1px solid var(--border);border-radius:8px;font-family:'Cormorant Garamond',serif;font-size:1.1rem;text-align:center;color:var(--text);background:var(--white);outline:none;transition:border-color .2s}
.qty-custom-input:focus{border-color:var(--gold-lt)}
.qty-helper{font-size:var(--text-xs);color:var(--pale);margin-top:12px;line-height:1.6}

.env-toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;margin-bottom:14px;background:var(--white);transition:border-color .2s}
.env-toggle:hover{border-color:var(--gold-lt)}
.env-toggle.on{border-color:var(--gold);background:rgba(184,151,106,.04)}
.toggle-label{display:flex;flex-direction:column;gap:2px}
.toggle-title{font-size:var(--text-sm);color:var(--text)}
.toggle-sub{font-size:var(--text-xs);color:var(--soft)}
.pill{width:36px;height:20px;border-radius:10px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0}
.env-toggle.on .pill{background:var(--gold)}
.knob{width:16px;height:16px;border-radius:50%;background:var(--white);position:absolute;top:2px;left:2px;transition:left .2s}
.env-toggle.on .knob{left:18px}
.env-colours{display:flex;flex-wrap:wrap;gap:10px;padding-top:6px}
.env-colour{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.env-swatch{width:32px;height:32px;border-radius:50%;border:2px solid transparent;transition:all .2s}
.env-colour.on .env-swatch{border-color:var(--text);transform:scale(1.1)}
.env-cname{font-size:var(--text-xs);color:var(--soft);max-width:54px;text-align:center;line-height:1.3}
.env-colour.on .env-cname{color:var(--text);font-weight:500}

.delivery-list{display:flex;flex-direction:column;gap:8px}
.del-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;transition:border-color .2s;background:var(--white)}
.del-card:hover:not(.on){border-color:var(--gold-lt)}
.del-card.on{border-color:var(--gold);background:rgba(184,151,106,.04)}
.del-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.del-card.on .del-radio{border-color:var(--gold)}
.del-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:none}
.del-card.on .del-dot{display:block}
.del-info{flex:1}
.del-name{font-size:var(--text-sm);color:var(--text);margin-bottom:2px}
.del-time{font-size:var(--text-xs);color:var(--soft)}
.del-price{font-size:var(--text-sm);color:var(--gold);white-space:nowrap;font-weight:500}

.no-design-msg{max-width:560px;margin:80px auto;padding:48px 32px;background:var(--white);border:1px solid var(--border);border-radius:18px;text-align:center}
.no-design-msg h2{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:400;color:var(--text);margin-bottom:14px}
.no-design-msg p{font-size:var(--text-sm);color:var(--soft);line-height:1.85;margin-bottom:24px}
.no-design-msg .cs-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--gold);color:#fff;font-family:'Jost',sans-serif;font-size:var(--text-xs);letter-spacing:.16em;text-transform:uppercase;font-weight:500;border-radius:60px;text-decoration:none}
.no-design-msg .cs-btn:hover{background:var(--brown)}

@media (max-width: 1024px){
  .order-wrap{grid-template-columns:1fr;gap:32px}
  .summary-col{position:static}
}
@media (max-width: 760px){
  .order-wrap{padding:8px 20px 80px}
  .paper-grid{grid-template-columns:1fr}
  .qty-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div id="site-header"></div>
<div id="orderRoot"></div>
<div id="site-footer"></div>

<script>
// ─── 1. STATE — DECLARED FIRST so all functions can use it ───
const order = {
  qty: 50,
  base: 150,
  paperKey: 'smooth',
  paperName: 'Smooth White',
  paperUp: 0,
  envOn: false,
  envKey: 'white',
  envName: 'Brilliant white',
  envEach: 0.35,
  delKey: 'standard',
  delName: 'Standard delivery',
  delCost: 0
};

let designState = null;
try {
  const raw = sessionStorage.getItem('foreverprint_design');
  designState = raw ? JSON.parse(raw) : null;
} catch(e) { designState = null; }

// ─── 2. UTILITY FUNCTIONS ─────────────────────────────────
function fmt(n){ return '£' + n.toFixed(2); }

function priceForCustomQty(qty){
  if(qty <= 0) return 0;
  if(qty < 50)   return Math.round(qty * 3.6 * 100) / 100;
  if(qty < 100)  return Math.round(qty * 2.6 * 100) / 100;
  if(qty < 200)  return Math.round(qty * 2.1 * 100) / 100;
  return Math.round(qty * 1.7 * 100) / 100;
}

function recalc(){
  const invTotal = order.base + order.paperUp;
  const lq = document.getElementById('lineQty');     if(lq) lq.textContent = order.qty + ' invitations';
  const lp = document.getElementById('linePaper');   if(lp) lp.textContent = order.paperName + (order.paperUp > 0 ? ' (+£' + order.paperUp + ')' : '');
  const pb = document.getElementById('priceBase');   if(pb) pb.textContent = fmt(invTotal);

  const envLine = document.getElementById('envLine');
  let envCost = 0;
  if(order.envOn){
    envCost = order.envEach * order.qty;
    if(envLine) envLine.style.display = 'flex';
    const le  = document.getElementById('lineEnv');    if(le)  le.textContent = order.envName + ' envelopes';
    const les = document.getElementById('lineEnvSub'); if(les) les.textContent = order.qty + ' × £' + order.envEach.toFixed(2);
    const pe  = document.getElementById('priceEnv');   if(pe)  pe.textContent = fmt(envCost);
  } else {
    if(envLine) envLine.style.display = 'none';
  }

  const ld = document.getElementById('lineDel');   if(ld) ld.textContent = order.delName;
  const pd = document.getElementById('priceDel');  if(pd) pd.textContent = order.delCost === 0 ? 'Free' : fmt(order.delCost);

  const totalIncVat = invTotal + envCost + order.delCost;
  const exVat = totalIncVat / 1.2;
  const vat   = totalIncVat - exVat;
  const pn = document.getElementById('priceNet');   if(pn) pn.textContent = fmt(exVat);
  const pv = document.getElementById('priceVat');   if(pv) pv.textContent = fmt(vat);
  const pt = document.getElementById('priceTotal'); if(pt) pt.textContent = fmt(totalIncVat);
}

// ─── 3. CLICK HANDLERS (referenced from inline onclick=) ──
function selectPaper(el){
  document.querySelectorAll('.paper-card').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  order.paperKey = el.dataset.paper;
  order.paperUp = parseInt(el.dataset.up, 10);
  order.paperName = el.querySelector('.paper-name').textContent;
  recalc();
}

function switchQty(mode){
  document.querySelectorAll('.qty-tab').forEach(t => t.classList.remove('on'));
  document.getElementById('qtyTab' + (mode === 'preset' ? 'Preset' : 'Custom')).classList.add('on');
  document.getElementById('qtyPreset').style.display = mode === 'preset' ? 'block' : 'none';
  document.getElementById('qtyCustom').style.display = mode === 'custom' ? 'block' : 'none';
}

function selectQty(el){
  document.querySelectorAll('.qty-pill').forEach(p => p.classList.remove('on'));
  el.classList.add('on');
  order.qty = parseInt(el.dataset.qty, 10);
  order.base = parseFloat(el.dataset.base);
  recalc();
}

function toggleEnv(){
  order.envOn = !order.envOn;
  const t = document.getElementById('envToggle');
  const c = document.getElementById('envColours');
  if(t) t.classList.toggle('on', order.envOn);
  if(c) c.style.display = order.envOn ? 'block' : 'none';
  recalc();
}

function selectEnv(el){
  document.querySelectorAll('.env-colour').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  order.envKey  = el.dataset.env;
  order.envEach = parseFloat(el.dataset.each);
  order.envName = el.dataset.name;
  recalc();
}

function selectDel(el){
  document.querySelectorAll('.del-card').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  order.delKey  = el.dataset.del;
  order.delCost = parseInt(el.dataset.cost, 10);
  order.delName = el.dataset.name;
  recalc();
}

function addToBasket(){
  if(!designState) return;
  const invTotal = order.base + order.paperUp;
  const envCost  = order.envOn ? (order.envEach * order.qty) : 0;
  const totalIncVat = invTotal + envCost + order.delCost;

  const item = {
    type: 'template',
    templateId: designState.templateId,
    templateName: designState.templateName,
    name: designState.templateName + ' (personalised)',
    designData: designState,
    qty: order.qty,
    paper: order.paperKey,
    paperName: order.paperName,
    paperUpgrade: order.paperUp,
    basePrice: order.base,
    envelopes: {
      on: order.envOn,
      colour: order.envOn ? order.envKey : null,
      colourName: order.envOn ? order.envName : null,
      eachPrice: order.envOn ? order.envEach : 0,
      totalCost: envCost
    },
    delivery: order.delKey,
    deliveryName: order.delName,
    deliveryCost: order.delCost,
    total: totalIncVat,
    totalIncVat: totalIncVat,
    thumbnailSvg: designState.thumbnailSvg,
    icon: '✦',
    addedAt: Date.now()
  };

  let added = false;
  try {
    if(typeof addToCart === 'function'){
      addToCart(item);
      added = true;
    } else if(typeof window.cart !== 'undefined' && Array.isArray(window.cart)){
      window.cart.push(item);
      if(typeof saveCart === 'function') saveCart();
      if(typeof updateCartBadge === 'function') updateCartBadge();
      added = true;
    }
  } catch(e){ console.warn('Primary cart add failed:', e); }

  if(!added){
    try {
      const stored = localStorage.getItem('cart');
      const cart = stored ? JSON.parse(stored) : [];
      cart.push(item);
      localStorage.setItem('cart', JSON.stringify(cart));
      added = true;
    } catch(e){ console.error('localStorage cart fallback failed:', e); }
  }

  const btn = document.getElementById('addBtn');
  if(btn){
    btn.classList.add('added');
    btn.textContent = 'Added to basket';
  }

  setTimeout(() => {
    if(typeof openCart === 'function'){
      try { openCart(); } catch(e){}
    }
    if(btn){
      btn.classList.remove('added');
      btn.textContent = 'Add to basket';
    }
  }, 1200);
}

// ─── 4. PAGE RENDER ─────────────────────────────────────────
function renderNoDesignMessage(){
  document.getElementById('orderRoot').innerHTML = '<div class="no-design-msg"><h2>No design in progress</h2><p>It looks like you haven\'t personalised an invitation yet. Browse our considered collection of templates and pick the one that feels right.</p><a class="cs-btn" href="/design-studio-templates.html">Browse templates →</a></div>';
}

function renderOrderPage(){
  document.title = 'Choose your order | ' + designState.templateName + ' | Foreverprint';

  document.getElementById('orderRoot').innerHTML = `
    <div class="breadcrumb">
      <div class="breadcrumb-trail">
        <a href="/design-studio.html">Design Studio</a><span>›</span>
        <a href="/design-studio-templates.html">Customise a template</a><span>›</span>
        <a href="/design-studio-customise.html?template=${designState.templateId}">${designState.templateName}</a><span>›</span>
        Choose your order
      </div>
      <a href="/design-studio-customise.html?template=${designState.templateId}" class="breadcrumb-trail" style="font-size:var(--text-xs);color:var(--soft);text-decoration:none;">← Back to design</a>
    </div>

    <div class="order-wrap">

      <div class="summary-col">

        <div class="summary-thumb">
          <div class="thumb-img" id="thumbImg"></div>
          <div class="thumb-info">
            <div class="thumb-tag">Your design</div>
            <div class="thumb-name">${designState.templateName}</div>
            <div class="thumb-meta">A5 · ${designState.paletteName}</div>
            <a href="/design-studio-customise.html?template=${designState.templateId}" class="thumb-edit">← Edit design</a>
          </div>
        </div>

        <div class="summary-box">
          <h3>Order summary</h3>
          <div class="summary-line">
            <div class="item">
              <div id="lineQty">50 invitations</div>
              <div class="item-sub" id="linePaper">Smooth White paper</div>
            </div>
            <div class="price" id="priceBase">£150.00</div>
          </div>
          <div class="summary-line" id="envLine" style="display:none">
            <div class="item">
              <div id="lineEnv">Envelopes</div>
              <div class="item-sub" id="lineEnvSub">—</div>
            </div>
            <div class="price" id="priceEnv">—</div>
          </div>
          <div class="summary-line">
            <div class="item">
              <div id="lineDel">Standard delivery</div>
              <div class="item-sub">5–7 working days · Tracked DPD</div>
            </div>
            <div class="price" id="priceDel">Free</div>
          </div>
          <div class="summary-line subtle">
            <span>Subtotal (excl. VAT)</span>
            <span class="price" id="priceNet">£125.00</span>
          </div>
          <div class="summary-line subtle">
            <span>VAT (20%)</span>
            <span class="price" id="priceVat">£25.00</span>
          </div>
          <div class="summary-line total">
            <span>Total inc. VAT</span>
            <span class="price" id="priceTotal">£150.00</span>
          </div>
        </div>

        <button class="add-btn" id="addBtn" onclick="addToBasket()">Add to basket</button>

      </div>

      <div class="controls-col">

        <div class="section">
          <h2 class="section-h">Paper stock</h2>
          <p class="section-help">All papers are professionally printed. The cotton rag and vellum options have a noticeably more luxurious feel in the hand.</p>
          <div class="paper-grid">
            <div class="paper-card on" data-paper="smooth" data-up="0" onclick="selectPaper(this)">
              <div class="paper-name">Smooth White</div>
              <div class="paper-sub">300gsm · Crisp &amp; classic</div>
              <div class="paper-price">Included</div>
            </div>
            <div class="paper-card" data-paper="cotton" data-up="20" onclick="selectPaper(this)">
              <div class="paper-name">Cotton Rag</div>
              <div class="paper-sub">400gsm · Luxury feel</div>
              <div class="paper-price">+ £20</div>
            </div>
            <div class="paper-card" data-paper="vellum" data-up="35" onclick="selectPaper(this)">
              <div class="paper-name">Vellum</div>
              <div class="paper-sub">Translucent · Ethereal</div>
              <div class="paper-price">+ £35</div>
            </div>
          </div>
        </div>

        <div class="section">
          <h2 class="section-h">How many?</h2>
          <p class="section-help">Order a few extras — reprinting later costs more per unit.</p>

          <div class="qty-tabs">
            <button class="qty-tab on" id="qtyTabPreset" onclick="switchQty('preset')">Choose amount</button>
            <button class="qty-tab" id="qtyTabCustom" onclick="switchQty('custom')">Enter exact</button>
          </div>

          <div id="qtyPreset">
            <div class="qty-grid">
              <div class="qty-pill" data-qty="25" data-base="90" onclick="selectQty(this)">25</div>
              <div class="qty-pill on" data-qty="50" data-base="150" onclick="selectQty(this)">50</div>
              <div class="qty-pill" data-qty="75" data-base="195" onclick="selectQty(this)">75</div>
              <div class="qty-pill" data-qty="100" data-base="240" onclick="selectQty(this)">100</div>
              <div class="qty-pill" data-qty="125" data-base="280" onclick="selectQty(this)">125</div>
              <div class="qty-pill" data-qty="150" data-base="300" onclick="selectQty(this)">150</div>
              <div class="qty-pill" data-qty="200" data-base="350" onclick="selectQty(this)">200</div>
              <div class="qty-pill" data-qty="250" data-base="400" onclick="selectQty(this)">250</div>
            </div>
          </div>

          <div id="qtyCustom" style="display:none">
            <input class="qty-custom-input" type="number" min="10" placeholder="e.g. 85" id="qtyCustomInput"/>
            <div class="qty-helper">Minimum 10 invitations · You'll see the price update in your summary as you type.</div>
          </div>
        </div>

        <div class="section">
          <h2 class="section-h">Envelopes</h2>
          <p class="section-help">Add matching premium envelopes — sized to fit your invitation exactly.</p>

          <div class="env-toggle" id="envToggle" onclick="toggleEnv()">
            <div class="toggle-label">
              <span class="toggle-title">Add matching envelopes</span>
              <span class="toggle-sub">C5 · Premium gummed · from £0.35 each</span>
            </div>
            <div class="pill"><div class="knob"></div></div>

  const thumbImg = document.getElementById('thumbImg');
  if(thumbImg && designState.thumbnailSvg){
    thumbImg.innerHTML = designState.thumbnailSvg;
  }

  recalc();
}

// ─── 5. ENTRY ──────────────────────────────────────────────
if(!designState){
  renderNoDesignMessage();
} else {
  renderOrderPage();
}

// ─── 6. DELEGATED LISTENER FOR CUSTOM QUANTITY INPUT ───────
document.addEventListener('input', function(e){
  if(e.target && e.target.id === 'qtyCustomInput'){
    const n = parseInt(e.target.value, 10);
    if(!isNaN(n) && n >= 10){
      order.qty = n;
      order.base = priceForCustomQty(n);
      recalc();
    }
  }
});

// ─── 7. LOAD HEADER / FOOTER ───────────────────────────────
fetch('/header.html').then(r=>r.text()).then(html=>{
  document.getElementById('site-header').outerHTML = html;
  if(typeof updateCartBadge === 'function') updateCartBadge();
});
fetch('/footer.html').then(r=>r.text()).then(html=>{
  document.getElementById('site-footer').outerHTML = html;
});
</script>
