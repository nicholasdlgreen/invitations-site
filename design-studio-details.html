<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Add Your Details | Design With Our Tools | Foreverprint</title>
<meta name="description" content="Add your names, date and venue to your chosen wedding invitation design, then head to checkout."/>
<meta name="robots" content="noindex, follow"/>
<link rel="canonical" href="https://foreverprint.com/design-studio-details.html"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Add Your Details | Foreverprint"/>
<meta property="og:image" content="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=1200&q=80"/>
<meta property="og:site_name" content="Foreverprint"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<style>
.breadcrumb{background:var(--cream);padding:14px 32px;font-size:11px;letter-spacing:.04em;color:var(--pale);max-width:1280px;margin:0 auto}
.breadcrumb a{color:var(--soft);text-decoration:none}
.breadcrumb a:hover{color:var(--gold)}
.breadcrumb span{margin:0 8px;color:var(--pale)}

.dt-hero{background:var(--cream);padding:40px 32px 30px;text-align:center;border-bottom:1px solid var(--border)}
.dt-hero-inner{max-width:600px;margin:0 auto}
.dt-hero .tag{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:12px;display:block}
.dt-hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.9rem,3.4vw,2.5rem);font-weight:300;line-height:1.18;color:var(--text);margin-bottom:14px}
.dt-hero h1 em{font-style:italic;color:var(--gold)}
.dt-divider{width:48px;height:1px;background:var(--gold-lt);margin:16px auto}
.dt-hero p{font-size:14px;color:var(--soft);line-height:1.9;max-width:440px;margin:0 auto}

.dt-main{max-width:440px;margin:0 auto;padding:42px 32px 60px}
.dt-preview-wrap{display:flex;justify-content:center;margin-bottom:32px}
.dt-preview{width:212px;border:.5px solid var(--border);border-radius:7px;overflow:hidden;box-shadow:0 14px 40px rgba(61,46,36,.08)}
.dt-preview svg{display:block;width:100%}

.dt-field{margin-bottom:16px}
.dt-row{display:flex;gap:12px}
.dt-row .dt-field{flex:1}
.dt-label{font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--pale);display:block;margin-bottom:6px}
.dt-input{width:100%;font-family:'Jost',sans-serif;font-size:14px;font-weight:300;color:var(--text);padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--white);outline:none;transition:border-color .2s}
.dt-input:focus{border-color:var(--gold-lt)}

.dt-actions{margin-top:28px;text-align:center}
.dt-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;background:var(--gold);color:#fff;border:none;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;border-radius:60px;cursor:pointer;transition:background .25s}
.dt-btn:hover{background:var(--brown)}
.dt-refine-link{display:block;margin-top:18px;font-size:12px;color:var(--pale);letter-spacing:.03em;text-decoration:none;transition:color .2s}
.dt-refine-link:hover{color:var(--gold)}
.dt-refine-link span{border-bottom:1px solid var(--gold-lt);color:var(--soft)}

@media (max-width:760px){
  .dt-main{padding:32px 22px 48px}
  .breadcrumb{padding:14px 22px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
</head>
<body>

<div id="site-header"></div>

<div class="breadcrumb">
  <a href="/design-studio.html">Design Studio</a><span>&rsaquo;</span><a href="/design-studio-create.html">Design with our tools</a><span>&rsaquo;</span>Your details
</div>

<section class="dt-hero">
  <div class="dt-hero-inner">
    <span class="tag">Almost there</span>
    <h1>Add <em>your details.</em></h1>
    <div class="dt-divider"></div>
    <p>Replace the names below with your own. Your invitation updates as you type — then you're off to checkout.</p>
  </div>
</section>

<main class="dt-main">

  <div class="dt-preview-wrap">
    <div class="dt-preview" id="previewWrap"></div>
  </div>

  <div class="dt-row">
    <div class="dt-field">
      <label class="dt-label" for="fName1">Your name</label>
      <input class="dt-input" id="fName1" type="text" value="Charlotte"/>
    </div>
    <div class="dt-field">
      <label class="dt-label" for="fName2">Their name</label>
      <input class="dt-input" id="fName2" type="text" value="James"/>
    </div>
  </div>
  <div class="dt-field">
    <label class="dt-label" for="fDate">Date</label>
    <input class="dt-input" id="fDate" type="text" value="Saturday · 14 June 2026"/>
  </div>
  <div class="dt-field">
    <label class="dt-label" for="fVenue">Venue</label>
    <input class="dt-input" id="fVenue" type="text" value="Blenheim Palace"/>
  </div>

  <div class="dt-actions">
    <button class="dt-btn" id="dtContinue">
      <span class="btn-text">Continue to checkout</span>
    </button>
    <a class="dt-refine-link" href="/design-studio-customise.html?template=botanic">Want to change colours or fonts too? <span>Refine it instead</span></a>
  </div>

</main>

<div id="site-footer"></div>

<script>
fetch('/header.html').then(r=>r.text()).then(html=>{
  document.getElementById('site-header').outerHTML=html;
  if(typeof updateCartBadge==='function') updateCartBadge();
});
fetch('/footer.html').then(r=>r.text()).then(html=>{
  document.getElementById('site-footer').outerHTML=html;
});

// ─── READ THE CHOSEN DESIGN ──────────────────────────────────
let choice = { template:'botanic', recipe:'floral', palette:'blush', brief:{} };
try {
  const saved = JSON.parse(sessionStorage.getItem('foreverprint_design_choice') || 'null');
  if (saved) choice = Object.assign(choice, saved);
} catch(e){}

const PALS = {
  sage:    {name:'Sage & ivory',    bg:'#F4EFE8', leaf:'#8FA98F', accent:'#C29A9A', text:'#2E3B2A', sub:'#6B6258'},
  blush:   {name:'Blush & sage',    bg:'#F6EFE9', leaf:'#8FA98F', accent:'#C29A9A', text:'#3D2E24', sub:'#6B6258'},
  copper:  {name:'Copper & cream',  bg:'#FAF7F2', leaf:'#C97B3A', accent:'#9A7A55', text:'#3D2E24', sub:'#6B6258'},
  navy:    {name:'Navy & gold',     bg:'#FAF7F2', leaf:'#2C3E50', accent:'#B8976A', text:'#2C3E50', sub:'#6B6258'},
  burgundy:{name:'Burgundy & rose', bg:'#FAF7F2', leaf:'#8B2942', accent:'#C29A9A', text:'#3D2E24', sub:'#6B6258'},
  charcoal:{name:'Charcoal & ivory',bg:'#F4EFE8', leaf:'#4A4A4A', accent:'#9A9A9A', text:'#2A2A2A', sub:'#6B6258'}
};
const pal = PALS[choice.palette] || PALS.blush;
const recipe = ['sprig','floral','minimal'].includes(choice.recipe) ? choice.recipe : 'floral';

const MOTIFS = {
  sprig: p => `
    <path d="M74 42 Q73 53 74 64" stroke="${p.leaf}" stroke-width=".7" fill="none"/>
    <ellipse cx="74" cy="42" rx="1.8" ry="3.2" fill="${p.leaf}"/>
    <ellipse cx="70" cy="48" rx="2" ry="4" fill="${p.leaf}" transform="rotate(-38 70 48)"/>
    <ellipse cx="78" cy="48" rx="2" ry="4" fill="${p.leaf}" transform="rotate(38 78 48)"/>
    <ellipse cx="68" cy="55" rx="2.1" ry="4.2" fill="${p.leaf}" transform="rotate(-32 68 55)"/>
    <ellipse cx="80" cy="55" rx="2.1" ry="4.2" fill="${p.leaf}" transform="rotate(32 80 55)"/>`,
  floral: p => `
    <g fill="${p.leaf}">
      <ellipse cx="58" cy="52" rx="1.7" ry="3.4" transform="rotate(-50 58 52)"/>
      <ellipse cx="64" cy="48" rx="1.7" ry="3.4" transform="rotate(-30 64 48)"/>
      <ellipse cx="74" cy="46" rx="1.7" ry="3.4"/>
      <ellipse cx="84" cy="48" rx="1.7" ry="3.4" transform="rotate(30 84 48)"/>
      <ellipse cx="90" cy="52" rx="1.7" ry="3.4" transform="rotate(50 90 52)"/>
    </g>
    <ellipse cx="62" cy="58" rx="1.6" ry="3" fill="${p.accent}" transform="rotate(-40 62 58)"/>
    <ellipse cx="74" cy="60" rx="1.7" ry="3.2" fill="${p.accent}"/>
    <ellipse cx="86" cy="58" rx="1.6" ry="3" fill="${p.accent}" transform="rotate(40 86 58)"/>`,
  minimal: p => `
    <line x1="50" y1="70" x2="98" y2="70" stroke="${p.accent}" stroke-width=".5"/>
    <line x1="50" y1="176" x2="98" y2="176" stroke="${p.accent}" stroke-width=".5"/>`
};

function renderInvite(){
  const spaced = recipe==='minimal';
  const ls = spaced ? 'letter-spacing="1.4"' : '';
  const ns = spaced ? 11 : 12.5;
  const div = (recipe==='minimal') ? '' : `<line x1="60" y1="144" x2="88" y2="144" stroke="${pal.leaf}" stroke-width=".5"/>`;
  return `<svg id="previewSvg" viewBox="0 0 148 210" xmlns="http://www.w3.org/2000/svg" style="background:${pal.bg}">
    <rect id="bg" width="148" height="210" fill="${pal.bg}"/>
    ${MOTIFS[recipe](pal)}
    <text x="74" y="84" text-anchor="middle" font-family="Georgia,serif" font-size="4.1" font-style="italic" fill="${pal.sub}" letter-spacing="1">together with their families</text>
    <text id="pvName1" x="74" y="103" text-anchor="middle" font-family="Georgia,serif" font-size="${ns}" fill="${pal.text}" ${ls}>Charlotte</text>
    <text x="74" y="118" text-anchor="middle" font-family="Georgia,serif" font-size="6.3" font-style="italic" fill="${pal.accent}">&amp;</text>
    <text id="pvName2" x="74" y="134" text-anchor="middle" font-family="Georgia,serif" font-size="${ns}" fill="${pal.text}" ${ls}>James</text>
    ${div}
    <text id="pvDate" x="74" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="4.4" font-style="italic" fill="${pal.sub}">Saturday &#183; 14 June 2026</text>
    <text id="pvVenue" x="74" y="164" text-anchor="middle" font-family="Georgia,serif" font-size="4.4" fill="${pal.sub}">Blenheim Palace</text>
  </svg>`;
}
document.getElementById('previewWrap').innerHTML = renderInvite();

// ─── LIVE BINDING ────────────────────────────────────────────
function bind(inputId, svgId){
  const i = document.getElementById(inputId), o = document.getElementById(svgId);
  if(i && o) i.addEventListener('input', () => { o.textContent = i.value || ' '; });
}
bind('fName1','pvName1');
bind('fName2','pvName2');
bind('fDate','pvDate');
bind('fVenue','pvVenue');

// ─── PRINT-READY SVG (3mm bleed) — matches the customise page ─
function buildPrintReadySvg(){
  const svgEl = document.getElementById('previewSvg');
  const bleed = 3, trimW = 148, trimH = 210, totW = trimW + 2*bleed, totH = trimH + 2*bleed;
  const print = svgEl.cloneNode(true);
  print.setAttribute('width', totW + 'mm');
  print.setAttribute('height', totH + 'mm');
  print.setAttribute('viewBox', `0 0 ${totW} ${totH}`);
  const bg = print.querySelector('#bg');
  if (bg){ bg.setAttribute('x','0'); bg.setAttribute('y','0'); bg.setAttribute('width', String(totW)); bg.setAttribute('height', String(totH)); }
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const wrapper = document.createElementNS(SVG_NS, 'g');
  wrapper.setAttribute('transform', `translate(${bleed} ${bleed})`);
  Array.from(print.children).forEach(ch => { if (ch !== bg) wrapper.appendChild(ch); });
  print.appendChild(wrapper);
  return print.outerHTML;
}

// ─── CONTINUE → EXISTING CHECKOUT ────────────────────────────
document.getElementById('dtContinue').addEventListener('click', () => {
  const text = {
    name1: document.getElementById('fName1').value,
    name2: document.getElementById('fName2').value,
    date:  document.getElementById('fDate').value,
    venue: document.getElementById('fVenue').value
  };
  const designState = {
    templateId: 'ai-' + recipe,
    templateName: 'Your design',
    size: 'A5', sizeLabel: 'A5', sizeMm: '148 × 210mm',
    palette: choice.palette, paletteName: pal.name,
    text: text,
    thumbnailSvg: buildPrintReadySvg(),
    bleedMm: 3,
    trimMm: { w:148, h:210 },
    bleedBoxMm: { w:154, h:216 }
  };
  // Hand off to the existing order flow, design-studio mode (skips upload step)
  sessionStorage.setItem('foreverprint_design', JSON.stringify(designState));
  window.location.href = '/upload-and-print.html?source=design-studio';
});
</script>

</body>
</html>
