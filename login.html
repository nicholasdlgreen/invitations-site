<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign in — forever·print</title>
<meta name="description" content="Sign in to your forever·print account to view your orders and saved designs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="/prefetch.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/auth.js"></script>
<style>
  :root{
    --cream:#FAF7F2;--white:#FFFFFF;--gold:#B8976A;--gold-lt:#D4B896;
    --brown:#6B4F3A;--text:#3D2E24;--soft:#7A6A5C;--pale:#A89788;
    --border:#E5DDD0;--err:#B85C5C;--ok:#5C8A6A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--cream);color:var(--text);font-family:'Jost',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;display:flex;flex-direction:column;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
  .auth-card{width:100%;max-width:440px;background:var(--white);border:1px solid var(--border);border-radius:20px;padding:48px 40px;box-shadow:0 12px 36px rgba(61,46,36,.06);}
  @media(max-width:560px){.auth-card{padding:36px 24px;}}
  .auth-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:14px;}
  .auth-title{font-family:'Cormorant Garamond',serif;font-size:2.1rem;font-weight:400;color:var(--text);text-align:center;margin-bottom:8px;line-height:1.15;}
  .auth-sub{font-size:13px;color:var(--soft);text-align:center;margin-bottom:32px;line-height:1.6;}
  .form-group{margin-bottom:18px;}
  .form-label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .form-label{font-size:11px;font-weight:500;color:var(--text);letter-spacing:.08em;text-transform:uppercase;}
  .form-label-link{font-size:11px;color:var(--gold);text-decoration:none;font-weight:500;}
  .form-label-link:hover{color:var(--brown);}
  .form-input{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:10px;background:var(--cream);font-family:inherit;font-size:14px;color:var(--text);font-weight:400;transition:border-color .2s,background .2s;}
  .form-input:focus{outline:none;border-color:var(--gold);background:var(--white);}
  .btn-submit{width:100%;background:var(--gold);color:var(--white);border:none;padding:15px 24px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:500;letter-spacing:.04em;cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;}
  .btn-submit:hover:not(:disabled){background:var(--brown);}
  .btn-submit:disabled{background:var(--pale);cursor:not-allowed;}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .auth-divider{display:flex;align-items:center;gap:12px;margin:26px 0;color:var(--pale);font-size:11px;letter-spacing:.1em;text-transform:uppercase;}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .auth-foot{text-align:center;font-size:13px;color:var(--soft);}
  .auth-foot a{color:var(--gold);text-decoration:none;font-weight:500;}
  .auth-foot a:hover{color:var(--brown);}
  .form-msg{padding:12px 16px;border-radius:10px;font-size:12px;margin-bottom:18px;display:none;line-height:1.5;}
  .form-msg.err{background:#FCEAEA;color:var(--err);display:block;}
  .form-msg.ok{background:#EAF4ED;color:var(--ok);display:block;}
</style>
</head>
<body>

<header id="site-header"></header>

<main>
  <div class="auth-card">
    <div class="auth-eyebrow">forever·print</div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to view your orders and saved designs.</p>

    <div id="formMsg" class="form-msg"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="form-group">
        <div class="form-label-row">
          <label class="form-label" for="password">Password</label>
          <a class="form-label-link" href="/forgot-password.html">Forgot?</a>
        </div>
        <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="submitText">Sign in</span>
      </button>
    </form>

    <div class="auth-divider">or</div>

    <div class="auth-foot">
      New to forever·print? <a href="/register.html">Create an account</a>
    </div>
    <div class="auth-foot" style="margin-top:16px;font-size:11px;color:var(--pale);">
      You don't need an account to place an order — <a href="/upload-and-print.html" style="color:var(--pale);text-decoration:underline;">order as a guest</a>.
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script>
  fetch('/header.html').then(r=>r.text()).then(h=>{document.getElementById('site-header').innerHTML=h;}).catch(()=>{});
  fetch('/footer.html').then(r=>r.text()).then(h=>{document.getElementById('site-footer').innerHTML=h;}).catch(()=>{});
</script>

<script>
const form = document.getElementById('loginForm');
const submitBtn = document.getElementById('submitBtn');
const submitText = document.getElementById('submitText');
const spinner = document.getElementById('spinner');
const formMsg = document.getElementById('formMsg');

function showMsg(text, type){
  formMsg.textContent = text;
  formMsg.className = 'form-msg ' + type;
}
function clearMsg(){ formMsg.className = 'form-msg'; formMsg.textContent = ''; }
function setLoading(loading){
  submitBtn.disabled = loading;
  spinner.style.display = loading ? 'inline-block' : 'none';
  submitText.textContent = loading ? 'Signing in…' : 'Sign in';
}

const params = new URLSearchParams(window.location.search);
if (params.get('verified') === 'true'){
  showMsg('Your email has been verified — please sign in to continue.', 'ok');
}
if (params.get('reset') === 'true'){
  showMsg('Your password has been updated — please sign in.', 'ok');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMsg();

  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;

  if (!email || !password){
    showMsg('Please enter your email and password.', 'err');
    return;
  }

  if (!window.invAuth || !window.invAuth.signInWithPassword){
    showMsg('Sign-in is not available right now. Please try again in a moment.', 'err');
    return;
  }

  setLoading(true);

  const { error } = await window.invAuth.signInWithPassword(email, password);

  if (error){
    setLoading(false);
    let msg = error.message;
    if (msg.toLowerCase().includes('invalid login') || msg.toLowerCase().includes('invalid email')){
      msg = 'Email or password is incorrect. Please try again.';
    } else if (msg.toLowerCase().includes('email not confirmed')){
      msg = 'Please verify your email first — check your inbox for the verification link we sent.';
    }
    showMsg(msg, 'err');
    return;
  }

  // Success — redirect to where they wanted to go.
  // Default to home (/) for now since /account.html doesn't exist yet.
  // When we build the account dashboard, change this default to /account.html.
  const redirectTo = params.get('next') || '/';
  window.location.href = redirectTo;
});

// On page load, handle a few states:
// 1. If user just verified their email (?verified=true) and is auto-logged-in
//    by Supabase, show a welcome message — DON'T auto-redirect (better UX
//    than dumping them somewhere unexpected).
// 2. If user is already signed in (returning visit) and there's no special
//    state, redirect to home (or 'next' param).
(async () => {
  if (!window.invAuth || !window.invAuth.init) return;
  await window.invAuth.init();

  const justVerified = params.get('verified') === 'true';

  if (justVerified && window.invAuth.isLoggedIn()){
    // Replace the form with a welcome message. They're already signed in.
    const formEl = document.getElementById('loginForm');
    const subEl = document.querySelector('.auth-sub');
    const titleEl = document.querySelector('.auth-title');
    if (titleEl) titleEl.textContent = 'Welcome to forever·print';
    if (subEl) subEl.textContent = 'Your account is verified and you\'re signed in.';
    if (formEl){
      formEl.innerHTML =
        '<a href="/" class="btn-submit" style="text-decoration:none;">Continue to forever·print</a>';
    }
    // Hide the divider + bottom links since they don't apply now
    document.querySelectorAll('.auth-divider, .auth-foot').forEach(el => el.style.display = 'none');
    return;
  }

  // Returning visitor already signed in — quietly redirect
  if (window.invAuth.isLoggedIn()){
    const redirectTo = params.get('next') || '/';
    window.location.href = redirectTo;
  }
})();
</script>

</body>
</html>
