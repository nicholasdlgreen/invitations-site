<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<!--FAVICON-->
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="/img/brand/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/img/brand/favicon-16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/img/brand/favicon-180.png"/>
<!--/FAVICON-->
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Make some tweaks | foreverprint</title>
<meta name="robots" content="noindex"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--cream:#FAF7F2;--white:#FFFFFF;--border:#E8DDD8;--gold:#B8976A;--gold-lt:#D4B896;--brown:#6B4F3A;--text:#3D2E24;--soft:#7A6558;--pale:#B0A098;--text-xs:clamp(13px, 0.55vw + 11px, 15px);--text-sm:clamp(15px, 0.6vw + 12px, 17px);--text-body:clamp(17px, 0.7vw + 14px, 19px);--text-h3:clamp(21px, 1.3vw + 16px, 27px);}
body{margin:0;background:#F1EFE9;font-family:'Jost',sans-serif;color:var(--text);}
.tw-wrap{max-width:1000px;margin:0 auto;padding:40px 24px 80px;}
.tw-eyebrow{text-align:center;font-size:var(--text-xs);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
.tw-title{text-align:center;font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,4vw,2.6rem);font-weight:400;margin:0 0 8px;}
.tw-sub{text-align:center;font-size:var(--text-body);color:var(--soft);max-width:480px;margin:0 auto 30px;line-height:1.7;}
.tw-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start;}
.tw-preview{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:18px;position:sticky;top:20px;}
/* The same type sizes as the create page, expressed the same way: a share of
   the card, not of the window. This page used fixed pixels — 32px for the
   names — against a card that is a different height again, so the wording
   showed about a third smaller here than on the page it came from: 4.9%% of
   the card against 7.2%% at a 1280px window. Go to tweak and the text shrank,
   come back and it grew, with nothing changed but the page. */
.tw-canvas{--ds-cardh:536px;aspect-ratio:3/4;background:var(--cream);border-radius:8px;overflow:hidden;position:relative;box-shadow:0 8px 26px rgba(61,46,36,.12);}
.tw-canvas img{width:100%;height:100%;object-fit:cover;display:block;}
.tw-textlayer{position:absolute;inset:0;z-index:2;pointer-events:none;}
/* 78%, the same as .ds-canvas.is-generated .ds-stack on the create page. At
   84% the identical wording wrapped onto more lines here than it did there,
   so a block that had been fitted to 62% of the card arrived taller. */
.tw-stack{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78%;max-width:78%;text-align:center;transform-origin:center center;}
.tw-canvas.is-square .tln.names{font-size:calc(var(--ds-cardh) * 6.384 / 100);margin-bottom:calc(var(--ds-cardh) * 0.747 / 100);}
.tw-fit-note{margin-top:12px;font-size:var(--text-xs);color:var(--soft);background:#FDF6EC;border:1px solid var(--gold-lt);border-radius:8px;padding:9px 12px;line-height:1.6;}
.tln{font-family:'Cormorant Garamond',serif;color:#3D3833;line-height:1.32;display:none;}
.tln.show{display:block;}
.tln.host{font-style:italic;color:#8A7A68;font-size:calc(var(--ds-cardh) * 3.015 / 100);margin-bottom:calc(var(--ds-cardh) * 1.68 / 100);}
.tln.request{font-style:italic;color:#5C5148;font-size:calc(var(--ds-cardh) * 2.857 / 100);margin-bottom:calc(var(--ds-cardh) * 2.24 / 100);}
.tln.names{font-weight:500;line-height:1.08;font-size:calc(var(--ds-cardh) * 7.449 / 100);margin-bottom:calc(var(--ds-cardh) * 0.747 / 100);}
.tln.date{letter-spacing:.5px;font-size:calc(var(--ds-cardh) * 3.174 / 100);margin-top:calc(var(--ds-cardh) * 2.054 / 100);}
.tln.time{color:#5C5148;font-size:calc(var(--ds-cardh) * 2.857 / 100);margin-bottom:calc(var(--ds-cardh) * 1.12 / 100);}
.tln.venue{letter-spacing:.5px;font-size:calc(var(--ds-cardh) * 3.174 / 100);margin-top:calc(var(--ds-cardh) * 1.68 / 100);}
.tln.reception{font-style:italic;color:#5C5148;font-size:calc(var(--ds-cardh) * 2.857 / 100);margin-top:calc(var(--ds-cardh) * 2.054 / 100);}
.tln.dress{letter-spacing:.1em;text-transform:uppercase;color:#8A7A68;font-size:calc(var(--ds-cardh) * 2.66 / 100);margin-top:calc(var(--ds-cardh) * 1.68 / 100);}
.tln.rsvp{color:#8A7A68;font-size:calc(var(--ds-cardh) * 2.66 / 100);margin-top:calc(var(--ds-cardh) * 1.68 / 100);}
.tln.custom{font-style:italic;color:#B8976A;font-size:calc(var(--ds-cardh) * 2.857 / 100);margin-top:calc(var(--ds-cardh) * 2.054 / 100);}
/* The create page falls back to 'body' when a field has no preview_style.
   Nothing in studio_fields uses it today, but a new field added through
   admin without a style would otherwise land here unstyled. */
.tln.body{color:#5C5148;font-size:calc(var(--ds-cardh) * 2.857 / 100);margin-top:calc(var(--ds-cardh) * 1.68 / 100);}
.tw-loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(251,248,244,.85);font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:var(--text-body);}
.tw-loading.show{display:flex;}
.tw-panel{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:24px;}
.tw-h{font-family:'Cormorant Garamond',serif;font-size:var(--text-h3);margin:0 0 4px;}
.tw-hint{font-size:var(--text-sm);color:var(--soft);margin:0 0 16px;line-height:1.6;}
.tw-label{font-size:var(--text-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:16px 0 8px;}
.tw-chips{display:flex;gap:7px;flex-wrap:wrap;}
.tw-chip{border:1px solid var(--border);background:var(--white);border-radius:60px;padding:8px 15px;font-size:var(--text-sm);color:var(--soft);cursor:pointer;transition:all .2s;}
.tw-chip:hover{border-color:var(--gold-lt);}
.tw-chip.on{border-color:var(--gold);background:#F4EDE6;color:var(--brown);}
.tw-text{width:100%;box-sizing:border-box;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'Jost',sans-serif;font-size:var(--text-sm);color:var(--text);outline:none;line-height:1.6;resize:vertical;min-height:70px;margin-top:8px;}
.tw-text:focus{border-color:var(--focus,var(--soft));}
.tw-go{display:block;width:100%;margin-top:20px;background:var(--gold);color:#fff;border:none;font-size:var(--text-xs);letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:15px;border-radius:60px;cursor:pointer;}
.tw-go:hover{background:var(--brown);}
.tw-go:disabled{opacity:.6;cursor:default;}
.tw-actions{display:none;flex-direction:column;gap:10px;margin-top:20px;}
.tw-actions.show{display:flex;}
.tw-keep{background:var(--text);color:var(--cream);border:none;font-size:var(--text-xs);letter-spacing:.12em;text-transform:uppercase;padding:15px;border-radius:60px;cursor:pointer;}
.tw-again{background:none;color:var(--gold);border:1px solid var(--gold-lt);font-size:var(--text-xs);letter-spacing:.12em;text-transform:uppercase;padding:14px;border-radius:60px;cursor:pointer;}
.tw-back{background:none;color:var(--soft);border:none;font-size:var(--text-xs);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px;}
@media(max-width:800px){.tw-grid{grid-template-columns:1fr;}.tw-preview{position:static;}}
</style>
</head>
<body>
<div class="tw-wrap">
  <div class="tw-eyebrow">Design your own · Make some tweaks</div>
  <h1 class="tw-title">Let's refine it</h1>
  <p class="tw-sub">Tell us what to change — we'll edit just that part and keep the rest of your design exactly as it is.</p>

  <div class="tw-grid">
    <div class="tw-preview">
      <div class="tw-canvas" id="tw-canvas">
        <img id="tw-img" alt="Your design"/>
        <div class="tw-textlayer" id="tw-textlayer">
          <div class="tw-stack" id="tw-stack">
            <div class="tln host"   data-k="host"></div>
            <div class="tln request" data-k="line"></div>
            <div class="tln names"  data-k="names"></div>
            <div class="tln date"   data-k="date"></div>
            <div class="tln time"   data-k="time"></div>
            <div class="tln venue"  data-k="venue"></div>
            <div class="tln reception" data-k="reception"></div>
            <div class="tln dress"  data-k="dress"></div>
            <div class="tln rsvp"   data-k="rsvp"></div>
            <div class="tln custom" data-k="custom"></div>
          </div>
        </div>
        <div class="tw-loading" id="tw-loading">Tweaking your design…</div>
      </div>
      <div class="tw-fit-note" id="tw-fit-note" role="status" style="display:none;"></div>
    </div>

    <div class="tw-panel">
      <div class="tw-h">What would you like to change?</div>
      <div class="tw-hint">Pick a quick tweak or describe it in your own words.</div>

      <div class="tw-label">Quick tweaks</div>
      <div class="tw-chips" id="tw-quick">
        <button class="tw-chip" data-v="add more flowers and make it more abundant">Add more flowers</button>
        <button class="tw-chip" data-v="remove some elements to make it simpler and more minimal">Make it simpler</button>
        <button class="tw-chip" data-v="make the design softer and more delicate">Softer</button>
        <button class="tw-chip" data-v="make the design bolder and more dramatic">Bolder</button>
        <button class="tw-chip" data-v="add more greenery and foliage">Add greenery</button>
        <button class="tw-chip" data-v="change the colours to warmer tones">Warmer tones</button>
        <button class="tw-chip" data-v="change the colours to cooler tones">Cooler tones</button>
        <button class="tw-chip" data-v="add more gold detailing">Add gold</button>
      </div>

      <div class="tw-label">Or describe it</div>
      <textarea class="tw-text" id="tw-desc" placeholder="e.g. change the pink roses to deep red · add eucalyptus in the corners · make the background a warmer cream…"></textarea>

      <button class="tw-go" id="tw-go">✦ Apply tweak</button>

      <div class="tw-actions" id="tw-actions">
        <button class="tw-keep" id="tw-keep">Love it — choose paper &amp; order →</button>
        <button class="tw-again" id="tw-again">Tweak again</button>
      </div>
      <button class="tw-back" id="tw-back">← Back to my design</button>
    </div>
  </div>
</div>

<script>
(function(){
  var state = null;
  try { state = JSON.parse(sessionStorage.getItem('fp_design_tweak') || 'null'); } catch(e){}
  if(!state || !state.image){ window.location.href = '/design-studio-ai-create.html?back=1'; return; }

  // ── THE SAME FIT AS THE CREATE PAGE ─────────────────────────────────
  // These three numbers and the maths further down are deliberately identical
  // to design-studio-ai-create.html. If one moves, move the other in the same
  // commit: the whole point is that a design looks the same on both pages.
  // They are declared up here because renderTextOverlay() below may call the
  // fit, and a `var` read before its line is undefined, not 0.78.
  var TEXT_AREA_W = 0.78;
  var TEXT_AREA_H = 0.62;
  var MIN_PRINT_PT = 7;

  // The card tells the type how big to be, exactly as on the create page.
  function sizeTextToCard(){
    var cv = document.getElementById('tw-canvas');
    if(!cv) return;
    var h = cv.getBoundingClientRect().height;
    if(h > 0) cv.style.setProperty('--ds-cardh', h + 'px');
  }
  // The card's own proportions, as chosen on the create page.
  (function applyCardShape(){
    var cv = document.getElementById('tw-canvas');
    if (!cv) return;
    cv.style.aspectRatio = state.cardRatio || '3/4';
    cv.classList.toggle('is-square', !!state.cardSquare);
  })();

  // Re-measure the note with the card, not just once on the way in. It was
  // decided from the first measurement, taken before the card had settled at
  // its final size, and never revisited: on an A5 with long wording the block
  // came out at 62.0% of the card -- 0.97px INSIDE the limit -- and the page
  // still told the customer their wording was too long for the card.
  function resync(){ sizeTextToCard(); overflowNote(); }
  sizeTextToCard();
  window.addEventListener('resize', resync);
  if (window.ResizeObserver) {
    try { new ResizeObserver(resync).observe(document.getElementById('tw-canvas')); } catch(e){}
  }

  var currentImage = state.image;
  document.getElementById('tw-img').src = currentImage;

  // render the customer's wording as an overlay, in the position they left it
  (function renderTextOverlay(){
    var stackEl = document.getElementById('tw-stack');

    // The create page sends the lines it actually rendered — each with the
    // style it was given and the words in it, in card order. Build from those.
    //
    // This used to match state.wording against a hardcoded
    // [host, line, names, date, …], which is the create page's FALLBACK order
    // rather than the order studio_fields returns. Wedding invitations begin
    // names, host, line — so the couple's names appeared in the host line and
    // the host in the request line. A birthday begins celebrant, age; a place
    // card names, table, meal. Order of service has fifteen front fields and
    // this page had ten slots, so five were simply lost. Every product was
    // wrong in some way, and nobody spotted it because the hardcoded list here
    // and the fallback there agreed with each other.
    if (Array.isArray(state.lines)) {
      stackEl.innerHTML = '';
      state.lines.forEach(function (l) {
        var val = (l && l.value || '').trim();
        if (!val) return;                         // an empty box is not a line
        var el = document.createElement('div');
        el.className = 'tln ' + (l.style || 'body') + ' show';
        el.dataset.k = l.key || '';
        el.textContent = val;
        stackEl.appendChild(el);
      });
    } else {
      // A design captured before this change, still sitting in sessionStorage.
      var order = ['host','line','names','date','time','venue','reception','dress','rsvp','custom'];
      var w = state.wording || [];
      document.querySelectorAll('#tw-stack .tln').forEach(function(el){
        var k = el.dataset.k;
        var idx = order.indexOf(k);
        var val = (idx>-1 && w[idx]) ? w[idx].trim() : '';
        if(val){ el.textContent = val; el.classList.add('show'); }
        else { el.classList.remove('show'); }
      });
    }
    // apply saved position
    var tp = state.textPos;
    var stack = document.getElementById('tw-stack');
    stack.style.left = (tp && tp.left) || '50%';
    stack.style.top  = (tp && tp.top)  || '50%';
    if (tp && tp.scale) {
      // The create page already fitted this, and the customer may have nudged
      // it afterwards. Their scale is the one that goes on the card.
      stack.style.transform = 'translate(-50%,-50%) scale(' + tp.scale + ')';
    } else {
      // No scale travelled with the design \u2014 a design saved before the fit
      // existed, or one rebuilt from the library. Fit it the same way the
      // create page would, so the two pages never show different proportions.
      fitTextToCard();
    }
    // One rule on both pages: the note is shown whenever the wording ends up
    // over the text area it was meant to sit inside, whoever set the scale.
    overflowNote();
  })();

  function cardHeightMm(){ return state.heightMm || 148; }

  function smallestLineRatio(){
    var smallest = null;
    document.querySelectorAll('#tw-stack .tln.show').forEach(function(el){
      var px = parseFloat(window.getComputedStyle(el).fontSize);
      if (smallest === null || px < smallest) smallest = px;
    });
    var cardPx = document.getElementById('tw-canvas').getBoundingClientRect().height;
    return (smallest && cardPx) ? smallest / cardPx : 0.0266;
  }

  function minLegibleScale(){
    var mmAtScale1 = smallestLineRatio() * cardHeightMm();
    var floorMm = MIN_PRINT_PT / 2.835;
    if (mmAtScale1 <= 0) return 0.5;
    return Math.min(1, Math.max(0.2, floorMm / mmAtScale1));
  }

  function fitTextToCard(){
    var canvas = document.getElementById('tw-canvas');
    var stack  = document.getElementById('tw-stack');
    if (!canvas || !stack) return false;
    var card = canvas.getBoundingClientRect();
    if (!card.height) return false;
    var prev = stack.style.transform;
    stack.style.transform = 'translate(-50%,-50%) scale(1)';
    var nat = stack.getBoundingClientRect();
    stack.style.transform = prev;
    if (!nat.height) return false;
    var fits = Math.min(TEXT_AREA_W * card.width / nat.width,
                        TEXT_AREA_H * card.height / nat.height);
    var floor = minLegibleScale();
    var wanted = Math.min(1, fits);
    var tooLong = wanted < floor;
    var applied = Math.max(floor, Math.min(1, wanted));
    stack.style.transform = 'translate(-50%,-50%) scale(' + applied + ')';
    return tooLong;
  }

  // Measured, not inherited: the create page may have shown the note and the
  // customer may have shortened a line since, or nudged the size themselves.
  function overflowNote(){
    var cv = document.getElementById('tw-canvas');
    var st = document.getElementById('tw-stack');
    if (!cv || !st) return;
    var card = cv.getBoundingClientRect();
    if (!card.height) return;
    showFitNote(st.getBoundingClientRect().height > TEXT_AREA_H * card.height + 1);
  }

  function showFitNote(show){
    var el = document.getElementById('tw-fit-note');
    if (!el) return;
    if (show && !el.textContent) {
      el.textContent = 'That is a lot of wording for this size of card. It is set as '
        + 'large as it can be and still print clearly \u2014 shortening a line, or '
        + 'choosing a bigger card, will give it more room.';
    }
    el.style.display = show ? 'block' : 'none';
  }

  var quick = [];

  document.querySelectorAll('#tw-quick .tw-chip').forEach(function(c){
    c.addEventListener('click', function(){
      c.classList.toggle('on');
      var v=c.dataset.v, i=quick.indexOf(v);
      if(i>-1) quick.splice(i,1); else quick.push(v);
    });
  });

  function applyTweak(){
    var desc = document.getElementById('tw-desc').value.trim();
    var tweak = quick.concat(desc?[desc]:[]).join(', ');
    if(!tweak){ tweak = 'a subtle refinement'; }

    var go = document.getElementById('tw-go');
    go.disabled = true; go.textContent = 'Tweaking…';
    document.getElementById('tw-loading').classList.add('show');

    fetch('/.netlify/functions/studio-tweak', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ imageUrl: currentImage, tweak: tweak, brief: state.brief || '' })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      go.disabled=false; go.textContent='✦ Apply another tweak';
      document.getElementById('tw-loading').classList.remove('show');
      if(data.image){
        currentImage = data.image;
        document.getElementById('tw-img').src = currentImage;
        document.getElementById('tw-actions').classList.add('show');
        // clear selections for the next round
        quick = [];
        document.querySelectorAll('#tw-quick .tw-chip.on').forEach(function(c){c.classList.remove('on');});
        document.getElementById('tw-desc').value='';
      } else {
        alert('Tweak had a problem: ' + (data.error || 'unknown'));
      }
    })
    .catch(function(err){
      go.disabled=false; go.textContent='✦ Apply tweak';
      document.getElementById('tw-loading').classList.remove('show');
      alert('Could not reach the tweak service: ' + err.message);
    });
  }

  document.getElementById('tw-go').addEventListener('click', applyTweak);
  document.getElementById('tw-again').addEventListener('click', function(){
    document.getElementById('tw-actions').classList.remove('show');
    document.getElementById('tw-desc').focus();
  });

  // Keep it → save the tweaked image back and return to create page to finalise
  // (so the flatten + order flow reuses the same "Love it" logic there).
  document.getElementById('tw-keep').addEventListener('click', function(){
    try {
      state.image = currentImage;
      sessionStorage.setItem('fp_design_tweak_result', JSON.stringify({ image: currentImage, size: state.size, wording: state.wording, textPos: state.textPos }));
    } catch(e){}
    window.location.href = '/design-studio-ai-create.html?tweaked=1';
  });

  document.getElementById('tw-back').addEventListener('click', function(){
    window.location.href = '/design-studio-ai-create.html?back=1';
  });
})();
</script>
  <script src="/analytics.js" defer></script>
</body>
</html>
