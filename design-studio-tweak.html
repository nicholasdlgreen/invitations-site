<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Make some tweaks | Foreverprint</title>
<meta name="robots" content="noindex"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--cream:#FBF8F4;--white:#fff;--border:#E4D8C8;--gold:#B8976A;--gold-lt:#C4B49B;--brown:#5C4A2E;--text:#3D3833;--soft:#8A7A68;--pale:#B0A098;--text-xs:13px;--text-sm:15px;--text-body:17px;--text-h3:20px;}
body{margin:0;background:#F1EFE9;font-family:'Jost',sans-serif;color:var(--text);}
.tw-wrap{max-width:1000px;margin:0 auto;padding:40px 24px 80px;}
.tw-eyebrow{text-align:center;font-size:var(--text-xs);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
.tw-title{text-align:center;font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,4vw,2.6rem);font-weight:400;margin:0 0 8px;}
.tw-sub{text-align:center;font-size:var(--text-body);color:var(--soft);max-width:480px;margin:0 auto 30px;line-height:1.7;}
.tw-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start;}
.tw-preview{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:18px;position:sticky;top:20px;}
.tw-canvas{aspect-ratio:3/4;background:var(--cream);border-radius:8px;overflow:hidden;position:relative;box-shadow:0 8px 26px rgba(61,46,36,.12);}
.tw-canvas img{width:100%;height:100%;object-fit:cover;display:block;}
.tw-textlayer{position:absolute;inset:0;z-index:2;pointer-events:none;}
.tw-stack{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84%;text-align:center;transform-origin:center center;}
.tln{font-family:'Cormorant Garamond',serif;color:#3D3833;line-height:1.32;display:none;}
.tln.show{display:block;}
.tln.host{font-style:italic;font-size:14px;color:#8A7A68;margin-bottom:9px;}
.tln.request{font-style:italic;font-size:13px;color:#5C5148;margin-bottom:12px;}
.tln.names{font-size:32px;font-weight:500;line-height:1.08;margin-bottom:4px;}
.tln.date{font-size:14px;letter-spacing:.5px;margin-top:11px;}
.tln.time{font-size:13px;color:#5C5148;margin-bottom:6px;}
.tln.venue{font-size:14px;letter-spacing:.5px;margin-top:9px;}
.tln.reception{font-style:italic;font-size:13px;color:#5C5148;margin-top:11px;}
.tln.dress{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8A7A68;margin-top:9px;}
.tln.rsvp{font-size:12px;color:#8A7A68;margin-top:9px;}
.tln.custom{font-style:italic;font-size:13px;color:#B8976A;margin-top:11px;}
.tw-loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(251,248,244,.85);font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:var(--text-body);}
.tw-loading.show{display:flex;}
.tw-panel{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:24px;}
.tw-h{font-family:'Cormorant Garamond',serif;font-size:var(--text-h3);margin:0 0 4px;}
.tw-hint{font-size:var(--text-sm);color:var(--soft);margin:0 0 16px;line-height:1.6;}
.tw-label{font-size:var(--text-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:16px 0 8px;}
.tw-chips{display:flex;gap:7px;flex-wrap:wrap;}
.tw-chip{border:1px solid var(--border);background:var(--white);border-radius:60px;padding:8px 15px;font-size:var(--text-sm);color:var(--soft);cursor:pointer;transition:all .2s;}
.tw-chip:hover{border-color:var(--gold-lt);}
.tw-chip.on{border-color:var(--gold);background:#F4EDE6;color:var(--brown);}
.tw-text{width:100%;box-sizing:border-box;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'Jost',sans-serif;font-size:var(--text-sm);color:var(--text);outline:none;line-height:1.6;resize:vertical;min-height:70px;margin-top:8px;}
.tw-text:focus{border-color:var(--gold-lt);}
.tw-go{display:block;width:100%;margin-top:20px;background:var(--gold);color:#fff;border:none;font-size:var(--text-xs);letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:15px;border-radius:60px;cursor:pointer;}
.tw-go:hover{background:var(--brown);}
.tw-go:disabled{opacity:.6;cursor:default;}
.tw-actions{display:none;flex-direction:column;gap:10px;margin-top:20px;}
.tw-actions.show{display:flex;}
.tw-keep{background:var(--text);color:var(--cream);border:none;font-size:var(--text-xs);letter-spacing:.12em;text-transform:uppercase;padding:15px;border-radius:60px;cursor:pointer;}
.tw-again{background:none;color:var(--gold);border:1px solid var(--gold-lt);font-size:var(--text-xs);letter-spacing:.12em;text-transform:uppercase;padding:14px;border-radius:60px;cursor:pointer;}
.tw-back{background:none;color:var(--soft);border:none;font-size:var(--text-xs);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px;}
@media(max-width:800px){.tw-grid{grid-template-columns:1fr;}.tw-preview{position:static;}}
</style>
</head>
<body>
<div class="tw-wrap">
  <div class="tw-eyebrow">Design your own · Make some tweaks</div>
  <h1 class="tw-title">Let's refine it</h1>
  <p class="tw-sub">Tell us what to change — we'll edit just that part and keep the rest of your design exactly as it is.</p>

  <div class="tw-grid">
    <div class="tw-preview">
      <div class="tw-canvas" id="tw-canvas">
        <img id="tw-img" alt="Your design"/>
        <div class="tw-textlayer" id="tw-textlayer">
          <div class="tw-stack" id="tw-stack">
            <div class="tln host"   data-k="host"></div>
            <div class="tln request" data-k="line"></div>
            <div class="tln names"  data-k="names"></div>
            <div class="tln date"   data-k="date"></div>
            <div class="tln time"   data-k="time"></div>
            <div class="tln venue"  data-k="venue"></div>
            <div class="tln reception" data-k="reception"></div>
            <div class="tln dress"  data-k="dress"></div>
            <div class="tln rsvp"   data-k="rsvp"></div>
            <div class="tln custom" data-k="custom"></div>
          </div>
        </div>
        <div class="tw-loading" id="tw-loading">Tweaking your design…</div>
      </div>
    </div>

    <div class="tw-panel">
      <div class="tw-h">What would you like to change?</div>
      <div class="tw-hint">Pick a quick tweak or describe it in your own words.</div>

      <div class="tw-label">Quick tweaks</div>
      <div class="tw-chips" id="tw-quick">
        <button class="tw-chip" data-v="add more flowers and make it more abundant">Add more flowers</button>
        <button class="tw-chip" data-v="remove some elements to make it simpler and more minimal">Make it simpler</button>
        <button class="tw-chip" data-v="make the design softer and more delicate">Softer</button>
        <button class="tw-chip" data-v="make the design bolder and more dramatic">Bolder</button>
        <button class="tw-chip" data-v="add more greenery and foliage">Add greenery</button>
        <button class="tw-chip" data-v="change the colours to warmer tones">Warmer tones</button>
        <button class="tw-chip" data-v="change the colours to cooler tones">Cooler tones</button>
        <button class="tw-chip" data-v="add more gold detailing">Add gold</button>
      </div>

      <div class="tw-label">Or describe it</div>
      <textarea class="tw-text" id="tw-desc" placeholder="e.g. change the pink roses to deep red · add eucalyptus in the corners · make the background a warmer cream…"></textarea>

      <button class="tw-go" id="tw-go">✦ Apply tweak</button>

      <div class="tw-actions" id="tw-actions">
        <button class="tw-keep" id="tw-keep">Love it — choose paper &amp; order →</button>
        <button class="tw-again" id="tw-again">Tweak again</button>
      </div>
      <button class="tw-back" id="tw-back">← Back to my design</button>
    </div>
  </div>
</div>

<script>
(function(){
  var state = null;
  try { state = JSON.parse(sessionStorage.getItem('fp_design_tweak') || 'null'); } catch(e){}
  if(!state || !state.image){ window.location.href = '/design-studio-ai-create.html?back=1'; return; }

  var currentImage = state.image;
  document.getElementById('tw-img').src = currentImage;

  // render the customer's wording as an overlay, in the position they left it
  (function renderTextOverlay(){
    // FIELD_MAP order matches the create page:
    // [host, line, names, date, time, venue, reception, dress, rsvp, custom]
    var order = ['host','line','names','date','time','venue','reception','dress','rsvp','custom'];
    var w = state.wording || [];
    document.querySelectorAll('#tw-stack .tln').forEach(function(el){
      var k = el.dataset.k;
      var idx = order.indexOf(k);
      var val = (idx>-1 && w[idx]) ? w[idx].trim() : '';
      if(val){ el.textContent = val; el.classList.add('show'); }
      else { el.classList.remove('show'); }
    });
    // apply saved position
    var tp = state.textPos;
    if(tp){
      var stack = document.getElementById('tw-stack');
      stack.style.left = tp.left || '50%';
      stack.style.top = tp.top || '50%';
      stack.style.transform = 'translate(-50%,-50%) scale('+(tp.scale||1)+')';
    }
  })();

  var quick = [];

  document.querySelectorAll('#tw-quick .tw-chip').forEach(function(c){
    c.addEventListener('click', function(){
      c.classList.toggle('on');
      var v=c.dataset.v, i=quick.indexOf(v);
      if(i>-1) quick.splice(i,1); else quick.push(v);
    });
  });

  function applyTweak(){
    var desc = document.getElementById('tw-desc').value.trim();
    var tweak = quick.concat(desc?[desc]:[]).join(', ');
    if(!tweak){ tweak = 'a subtle refinement'; }

    var go = document.getElementById('tw-go');
    go.disabled = true; go.textContent = 'Tweaking…';
    document.getElementById('tw-loading').classList.add('show');

    fetch('/.netlify/functions/studio-tweak', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ imageUrl: currentImage, tweak: tweak, brief: state.brief || '' })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      go.disabled=false; go.textContent='✦ Apply another tweak';
      document.getElementById('tw-loading').classList.remove('show');
      if(data.image){
        currentImage = data.image;
        document.getElementById('tw-img').src = currentImage;
        document.getElementById('tw-actions').classList.add('show');
        // clear selections for the next round
        quick = [];
        document.querySelectorAll('#tw-quick .tw-chip.on').forEach(function(c){c.classList.remove('on');});
        document.getElementById('tw-desc').value='';
      } else {
        alert('Tweak had a problem: ' + (data.error || 'unknown'));
      }
    })
    .catch(function(err){
      go.disabled=false; go.textContent='✦ Apply tweak';
      document.getElementById('tw-loading').classList.remove('show');
      alert('Could not reach the tweak service: ' + err.message);
    });
  }

  document.getElementById('tw-go').addEventListener('click', applyTweak);
  document.getElementById('tw-again').addEventListener('click', function(){
    document.getElementById('tw-actions').classList.remove('show');
    document.getElementById('tw-desc').focus();
  });

  // Keep it → save the tweaked image back and return to create page to finalise
  // (so the flatten + order flow reuses the same "Love it" logic there).
  document.getElementById('tw-keep').addEventListener('click', function(){
    try {
      state.image = currentImage;
      sessionStorage.setItem('fp_design_tweak_result', JSON.stringify({ image: currentImage, size: state.size, wording: state.wording, textPos: state.textPos }));
    } catch(e){}
    window.location.href = '/design-studio-ai-create.html?tweaked=1';
  });

  document.getElementById('tw-back').addEventListener('click', function(){
    window.location.href = '/design-studio-ai-create.html?back=1';
  });
})();
</script>
</body>
</html>
