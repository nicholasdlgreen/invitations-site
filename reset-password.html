<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Choose a new password — forever·print</title>
<meta name="description" content="Set your new forever·print password.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="/prefetch.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/auth.js"></script>
<style>
  :root{
    --cream:#FAF7F2;--white:#FFFFFF;--gold:#B8976A;--gold-lt:#D4B896;
    --brown:#6B4F3A;--text:#3D2E24;--soft:#7A6A5C;--pale:#A89788;
    --border:#E5DDD0;--err:#B85C5C;--ok:#5C8A6A;--warn:#C99B5F;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--cream);color:var(--text);font-family:'Jost',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;display:flex;flex-direction:column;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
  .auth-card{width:100%;max-width:440px;background:var(--white);border:1px solid var(--border);border-radius:20px;padding:48px 40px;box-shadow:0 12px 36px rgba(61,46,36,.06);}
  @media(max-width:560px){.auth-card{padding:36px 24px;}}
  .auth-eyebrow{font-size:var(--text-xs);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:14px;}
  .auth-title{font-family:'Cormorant Garamond',serif;font-size:2.1rem;font-weight:400;color:var(--text);text-align:center;margin-bottom:8px;line-height:1.15;}
  .auth-sub{font-size:var(--text-sm);color:var(--soft);text-align:center;margin-bottom:32px;line-height:1.6;}
  .form-group{margin-bottom:18px;}
  .form-label{display:block;font-size:var(--text-xs);font-weight:500;color:var(--text);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
  .form-input{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:10px;background:var(--cream);font-family:inherit;font-size:var(--text-body);color:var(--text);font-weight:400;transition:border-color .2s,background .2s;}
  .form-input:focus{outline:none;border-color:var(--gold);background:var(--white);}
  .form-hint{font-size:var(--text-xs);color:var(--pale);margin-top:5px;line-height:1.5;}
  .btn-submit{width:100%;background:var(--gold);color:var(--white);border:none;padding:15px 24px;border-radius:10px;font-family:inherit;font-size:var(--text-body);font-weight:500;letter-spacing:.04em;cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;}
  .btn-submit:hover:not(:disabled){background:var(--brown);}
  .btn-submit:disabled{background:var(--pale);cursor:not-allowed;}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .form-msg{padding:12px 16px;border-radius:10px;font-size:var(--text-sm);margin-bottom:18px;display:none;line-height:1.5;}
  .form-msg.err{background:#FCEAEA;color:var(--err);display:block;}
  .form-msg.ok{background:#EAF4ED;color:var(--ok);display:block;}
  .pw-strength{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden;}
  .pw-strength-bar{height:100%;width:0;transition:width .25s,background .25s;}
  .auth-foot{text-align:center;font-size:var(--text-sm);color:var(--soft);margin-top:24px;}
  .auth-foot a{color:var(--gold);text-decoration:none;font-weight:500;}
</style>
</head>
<body>

<header id="site-header"></header>

<main>
  <div class="auth-card">
    <div class="auth-eyebrow">forever·print</div>
    <h1 class="auth-title">Choose a new password</h1>
    <p class="auth-sub" id="subText">Set a new password for your account.</p>

    <div id="formMsg" class="form-msg"></div>

    <form id="resetForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="password">New password</label>
        <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
        <div class="pw-strength"><div id="pwBar" class="pw-strength-bar"></div></div>
        <div class="form-hint">Minimum 8 characters, include at least one number.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm">Confirm new password</label>
        <input class="form-input" type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="submitText">Update password</span>
      </button>
    </form>

    <div class="auth-foot">
      <a href="/login.html">← Back to sign in</a>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script>
  fetch('/header.html').then(r=>r.text()).then(h=>{document.getElementById('site-header').innerHTML=h;}).catch(()=>{});
  fetch('/footer.html').then(r=>r.text()).then(h=>{document.getElementById('site-footer').innerHTML=h;}).catch(()=>{});
</script>

<script>
// Password strength meter
const pwInput = document.getElementById('password');
const pwBar = document.getElementById('pwBar');
pwInput.addEventListener('input', () => {
  const v = pwInput.value;
  let score = 0;
  if (v.length >= 8) score++;
  if (/\d/.test(v)) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  if (v.length >= 12) score++;
  pwBar.style.width = (score / 5 * 100) + '%';
  pwBar.style.background = score < 2 ? 'var(--err)' : score < 4 ? 'var(--warn)' : 'var(--ok)';
});

const form = document.getElementById('resetForm');
const submitBtn = document.getElementById('submitBtn');
const submitText = document.getElementById('submitText');
const spinner = document.getElementById('spinner');
const formMsg = document.getElementById('formMsg');

function showMsg(text, type){
  formMsg.textContent = text;
  formMsg.className = 'form-msg ' + type;
}
function setLoading(loading){
  submitBtn.disabled = loading;
  spinner.style.display = loading ? 'inline-block' : 'none';
  submitText.textContent = loading ? 'Updating…' : 'Update password';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (password.length < 8){ showMsg('Password must be at least 8 characters.', 'err'); return; }
  if (!/\d/.test(password)){ showMsg('Password must include at least one number.', 'err'); return; }
  if (password !== confirm){ showMsg('Passwords don\'t match. Please try again.', 'err'); return; }

  if (!window.invAuth || !window.invAuth.updatePassword){
    showMsg('Service unavailable. Please try again in a moment.', 'err');
    return;
  }

  setLoading(true);

  const { error } = await window.invAuth.updatePassword(password);

  if (error){
    setLoading(false);
    let msg = error.message;
    if (msg.toLowerCase().includes('session') || msg.toLowerCase().includes('expired')){
      msg = 'This reset link has expired. Please request a new one.';
    }
    showMsg(msg, 'err');
    return;
  }

  // Sign the user out so they have to sign in with the new password
  try { await window.invAuth.signOut(); } catch(e) {}
  // signOut redirects to '/' — override that
  window.location.href = '/login.html?reset=true';
});

// On load, make sure the user is in a valid password-recovery session.
// Supabase auto-detects the recovery token in the URL fragment (detectSessionInUrl
// is true in auth.js init). If there's no session at all, the link was invalid.
(async () => {
  if (window.invAuth && window.invAuth.init){
    await window.invAuth.init();
    // Give Supabase a moment to process the URL fragment
    setTimeout(async () => {
      if (!window.invAuth.isLoggedIn()){
        showMsg('This reset link is invalid or has expired. Please request a new one from the forgot password page.', 'err');
        document.getElementById('submitBtn').disabled = true;
      }
    }, 300);
  }
})();
</script>

</body>
</html>
